<title>RMC301m Exam Prep</title>
<script defer src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* NEW EOS (Ver.2) look: slate window chrome, green primary, amber Student Guide, Inter (the app's bundled UI font). Single light look on purpose, like the exam client. */
:root{
  --page:#e9eef4; --win:#eef2f7; --body:#f8fafc; --paper:#ffffff;
  --ink:#0f172a; --text:#1e293b; --muted:#64748b; --line:#cbd5e1; --line-soft:#dde3eb; --tab:#f1f5f9;
  --green:#0f8a64; --green-d:#0b5d46; --green-l:#d1f0e6; --blue:#1d4ed8;
  --amber-bg:#fffbeb; --amber-line:#fcd34d; --amber-ink:#92400e; --orange:#ea580c;
  --good:#0f8a64; --bad:#dc2626; --cur:#ffffff; --cur-line:#0f8a64;
  --f:"Inter","Noto Sans","Segoe UI",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --ui:14px; --qs:16px; --qz:1; --qf:var(--f);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.wrapc{padding:20px max(16px,env(safe-area-inset-left,0px)) 28px max(16px,env(safe-area-inset-right,0px))}
/* window chrome */
.win{max-width:960px;margin:0 auto;background:var(--body);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.win.xl{max-width:1400px}
.win.exam{max-width:1280px}
.win-t{display:flex;align-items:center;gap:10px;background:var(--win);border-bottom:1px solid var(--line);padding:9px 16px;font-size:15px;font-weight:500;color:#334155}
.win-t .sp{flex:1}
.x{background:none;border:0;font:18px/1 var(--f);color:#64748b;cursor:pointer;padding:2px 6px;border-radius:4px}
.x:hover{background:#e2e8f0}
.win-b{padding:20px 24px 24px}
h1{font-size:21px;font-weight:700;color:var(--ink);margin:0 0 4px;letter-spacing:-.01em}
.hint{color:var(--muted);font-size:13px}
/* buttons */
.btn{font:500 13px var(--f);background:var(--body);border:1px solid #94a3b8;border-radius:6px;padding:5px 12px;color:var(--text);cursor:pointer}
.btn:hover{background:#eef2f7}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--green-d);border-color:var(--green-d);color:#fff;font-weight:600}
.btn.pri:hover{background:#094c39}
.btn.pri:disabled{background:#7aa596;border-color:#7aa596}
.btn:focus-visible,.num:focus-visible,input:focus-visible,select:focus-visible,.tabb:focus-visible,.chip:focus-visible{outline:2px solid var(--green);outline-offset:2px}
select,input[type=text]{font:14px var(--f);color:var(--text);background:#fff;border:1px solid #94a3b8;border-radius:6px;padding:6px 8px}
input[type=checkbox]{accent-color:var(--green-d)}
/* tabs (EOS question-type tabs) */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:14px 0 18px;padding:0}
.tabb{font:500 14px var(--f);background:var(--tab);border:1px solid transparent;border-bottom:0;border-radius:7px 7px 0 0;padding:8px 16px;cursor:pointer;color:#475569;margin-bottom:-1px}
.tabb:hover{color:var(--ink)}
.tabb[aria-selected="true"]{background:#fff;border-color:var(--line);color:var(--ink);font-weight:600}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.chip{font:500 12.5px var(--f);border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px;cursor:pointer;color:#334155}
.chip[aria-pressed="true"]{background:var(--green-l);border-color:var(--green);color:var(--green-d);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
/* setup = Sign in panel */
.setup{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:22px;align-items:start}
.signin{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px}
.pill{display:inline-block;background:var(--green-l);color:var(--green-d);font-weight:700;font-size:20px;border-radius:6px;padding:4px 10px;margin-bottom:10px}
.fld{display:block;margin:10px 0}
.fld>span{display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:4px}
.fld select{width:100%}
.ck{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:8px 0;cursor:pointer}
.signin .btn{width:100%;padding:9px;font-size:14px;margin-top:8px}
.steps{font-size:14px}
.steps ol{margin:6px 0 0;padding-left:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:6px 0 6px 34px}
.steps li::before{content:counter(s);position:absolute;left:0;top:5px;width:24px;height:24px;border-radius:50%;background:var(--orange);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
/* exam screen */
.exam{font-size:var(--ui)}
.ehead{display:grid;grid-template-columns:minmax(0,1.25fr) auto auto minmax(0,1fr);gap:16px;padding:12px 20px 10px;align-items:stretch}
.einfo{display:flex;flex-direction:column;color:#475569;font-size:.93em}
.einfo .ecode{font-weight:700;color:var(--ink);font-size:1.08em}
.ocode{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:12px;flex-wrap:wrap}
.ocode label{font-weight:600;color:var(--ink)}
.ocode input{width:120px}
.ectl{display:grid;grid-template-columns:auto 26px 30px 26px auto;gap:6px 6px;align-items:center;font-size:.93em;color:#475569}
.ectl .v{text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.ectl .pm{width:26px;height:24px;padding:0;border-radius:6px;font-size:13px}
.ectl .rs{padding:2px 10px}
.ectl select{grid-column:2/6;padding:3px 6px;font-size:1em}
.etime{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:180px}
.tbox{background:var(--green);color:#fff;border-radius:8px;padding:8px 18px;text-align:center;width:100%}
.tbox .tl{font-size:.9em;font-weight:500}
.tbox .tv{font-size:2.15em;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1.2}
.tst{color:#475569;font-size:.9em;margin-top:6px}
.eguide{background:var(--amber-bg);border:1.5px solid var(--amber-line);border-radius:8px;padding:9px 14px;font-size:.9em;color:#57401a}
.eguide b{color:var(--amber-ink);font-size:1.05em}
.eguide ul{margin:4px 0 0;padding-left:18px}
.etabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);background:linear-gradient(transparent 60%,transparent)}
.etab{font:500 1em var(--f);background:var(--tab);border:1px solid transparent;border-bottom:0;border-radius:7px 7px 0 0;padding:7px 18px;color:#475569;margin-bottom:-1px}
.etab.on{background:#fff;border-color:var(--line);color:var(--ink);font-weight:600}
.epanel{display:grid;grid-template-columns:minmax(220px,.75fr) 3px minmax(0,1.6fr);background:#fff;margin:0 20px;border:1px solid var(--line);border-top:0;min-height:430px}
.eleft{padding:14px 18px;display:flex;flex-direction:column}
.qn{color:var(--blue);font-weight:600;font-size:1.08em}
.albl{font-weight:600;color:var(--ink);margin:6px 0 4px}
.eleft label{display:flex;align-items:center;gap:10px;height:2.3em;cursor:pointer;font-size:1.05em;color:var(--ink);width:fit-content;padding-right:10px}
.eleft input{width:1.25em;height:1.25em;margin:0;cursor:pointer}
.enav{display:flex;gap:8px;margin-top:auto;padding-top:20px;flex-wrap:wrap}
.evdiv{background:var(--green);margin:12px 0}
.eright{min-width:0;display:flex;flex-direction:column}
.ztool{display:flex;gap:2px;align-items:center;padding:8px 16px 0;color:#475569;font-size:.9em;flex-wrap:wrap}
.ztool button{font:inherit;background:none;border:0;color:#475569;cursor:pointer;padding:2px 4px;border-radius:4px}
.ztool button:hover{background:var(--tab);color:var(--ink)}
.ztool .zv{margin-left:auto;font-variant-numeric:tabular-nums}
.q{padding:12px 22px 20px;overflow:auto;font-family:var(--qf);font-size:calc(var(--qs) * var(--qz));line-height:1.65;color:var(--ink)}
.q .stem{margin:0 0 18px;max-width:68ch}
.q .opt{margin:0 0 4px}
.q .ph{color:var(--muted);font-family:var(--f);font-size:15px;padding-top:30px;text-align:center}
.grid{display:flex;flex-wrap:wrap;gap:5px;padding:10px 20px 0}
.num{font:500 12.5px var(--f);width:36px;height:28px;background:#fff;border:1px solid var(--line);border-radius:5px;color:var(--text);cursor:pointer;padding:0}
.num.done{background:#e2e8f0}
.num.ok{background:#d1f0e6;border-color:var(--green)}
.num.no{background:#fde2e2;border-color:var(--bad)}
.num.cur{box-shadow:0 0 0 2px var(--blue);border-color:var(--blue)}
.efoot{display:flex;align-items:center;gap:12px;padding:12px 20px 14px;flex-wrap:wrap}
.efoot .sp{flex:1}
.efoot .saved{color:#475569;font-size:.93em}
.efoot .pri{padding:9px 22px;font-size:1.05em;border-radius:7px;background:var(--green);border-color:var(--green)}
/* dialogs */
.dlgw{position:fixed;inset:0;background:rgba(15,23,42,.35);display:grid;place-items:center;padding:16px;z-index:10}
.dlg{background:#fff;border:1px solid var(--line);border-radius:10px;max-width:520px;width:100%;padding:18px 20px;box-shadow:0 10px 30px rgba(15,23,42,.18);font-size:14px}
.dlg h2{margin:0 0 8px;font-size:18px;color:var(--ink)}
.dlg .warn{color:var(--bad);font-weight:600}
.dlg .ck{align-items:flex-start;background:var(--body);border:1px solid var(--line-soft);border-radius:6px;padding:8px 10px;margin:12px 0}
.dlg .ck small{display:block;color:var(--muted)}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px}
.dlg .acts .btn{padding:7px 16px}
/* submitted */
.subm{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:22px 24px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.subm h2{margin:0;font-size:22px;color:var(--ink)}
.subm p{margin:2px 0 0;color:#475569}
.subm .st{text-align:center}
.subm .st .tv{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.subm .st div:last-child{color:var(--green-d);font-weight:600}
.res{padding:18px 24px 24px}
.big{font-size:40px;font-weight:700;color:var(--green-d);font-variant-numeric:tabular-nums;line-height:1.1}
.rv{border-top:1px solid var(--line-soft);padding:10px 0;font-size:14px}
.rv .a{color:var(--good)} .rv .w{color:var(--bad)}
/* key */
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:4px;margin-top:6px;font-size:13px;font-variant-numeric:tabular-nums}
.kg span{border:1px solid var(--line-soft);background:#fff;border-radius:4px;padding:1px 6px}
.kg span.m{border-color:#f59e0b;background:var(--amber-bg)}
/* summary */
.ch{margin-top:24px;font-size:15px}
.ch h2{font-size:19px;color:var(--ink);margin:0 0 4px;font-weight:700}
.eyebrow{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ch h3{font-size:15px;margin:14px 0 4px;color:var(--ink)}
.ch ul{margin:4px 0;padding-left:20px}
.tw{overflow-x:auto;margin:8px 0}
.tw table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
.tw th,.tw td{border:1px solid var(--line-soft);padding:6px 9px;text-align:left;vertical-align:top}
.tw th{background:var(--tab);color:var(--ink)}
.trap{background:var(--amber-bg);border:1px solid var(--amber-line);border-left:4px solid #f59e0b;border-radius:6px;padding:8px 12px;margin:10px 0}
.term{font-weight:600}
.hot{background:#f0faf6;border:1px solid #b9e3d3;border-left:4px solid var(--green);border-radius:6px;padding:10px 14px;margin:8px 0}
.hot h3{margin:2px 0 4px;color:var(--green-d)}
.hot li{margin:3px 0}
.hot .btn{margin-top:8px}
details.th{margin-top:8px}
details.th>summary{cursor:pointer;color:var(--blue);font-weight:600;padding:4px 0}
.dist{border:1px solid var(--line);background:#fff;border-radius:8px;padding:12px 14px;margin:6px 0 4px}
.dr{display:grid;grid-template-columns:44px 1fr 96px;gap:8px;align-items:center;width:100%;background:none;border:0;padding:3px 0;font:13px var(--f);color:var(--text);cursor:pointer;text-align:left}
.db{background:var(--tab);height:12px;display:block;border-radius:3px;overflow:hidden}
.db i{display:block;height:100%;background:var(--green)}
.dr:hover .db i{background:var(--green-d)}
.dn{color:var(--muted);font-size:12.5px}
/* practice */
.pq{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:10px;background:#fff}
.pq .meta{font-size:12px;color:var(--muted)}
.pq .stem{margin:4px 0 8px;font-weight:600;color:var(--ink)}
.po{display:block;width:100%;text-align:left;font:14px var(--f);background:var(--body);border:1px solid var(--line-soft);border-radius:6px;padding:7px 10px;margin-top:5px;cursor:pointer;color:var(--ink)}
.po:hover:not(:disabled){border-color:#94a3b8}
.po:disabled{cursor:default}
.po.ok{background:#d1f0e6;border-color:var(--green)}
.po.no{background:#fde2e2;border-color:var(--bad)}
.explain{margin-top:14px;font-size:14px;background:#eff6ff;border:1px solid #bfdbfe;border-left:4px solid var(--blue);border-radius:6px;padding:8px 12px;font-family:var(--f)}
/* mindmap */
.mmlogic{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 12px;font-size:13px}
.mmlogic>span:not(.ar){border:1px solid;border-left-width:4px;border-radius:6px;padding:4px 10px;background:#fff}
.mmlogic .ar{color:var(--muted)}
#mmbox{border:1px solid var(--line);border-radius:8px;background:#fff;margin-top:6px;overflow:hidden}
#mmsvg{display:block;width:100%;height:72vh;min-height:460px}
.mml{margin-left:14px;font-size:14px}.mml summary{cursor:pointer;padding:2px 0}.mml.leaf{padding:2px 0 2px 14px}
@media (max-width:980px){
  .ehead{grid-template-columns:1fr 1fr}
  .eguide{grid-column:1/-1}
}
@media (max-width:720px){
  .wrapc{padding:10px 8px 20px}
  .win-b{padding:14px 14px 18px}
  .setup{grid-template-columns:1fr}
  .ehead{grid-template-columns:1fr;padding:10px 12px;gap:10px}
  .ectl{justify-content:start}
  .etime{flex-direction:row;gap:12px;min-width:0}
  .tbox{width:auto;padding:6px 14px}
  .etabs{padding:0 12px}
  .epanel{grid-template-columns:1fr;margin:0 12px}
  .evdiv{height:3px;margin:0 12px}
  .eleft{padding:12px 14px}
  .eleft label{height:2em}
  .enav{padding-top:8px}
  .eright{order:-2}
  .evdiv{order:-1}
  .q{padding:10px 14px 14px}
  .grid,.efoot{padding-left:12px;padding-right:12px}
  .tabb{padding:7px 11px;font-size:13px}
}
.subjbar{display:flex;gap:6px;margin:2px 0 12px}.subjb{font:600 13px var(--f);background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 16px;cursor:pointer;color:#475569}.subjb[aria-pressed="true"]{background:var(--green-d);border-color:var(--green-d);color:#fff}.subjb:hover{border-color:var(--green)}

/* classic EOS exam client (old WinForms look, per Haru's screenshot) */
.ceos{min-height:100vh;background:#f0f0f0;color:#000;font:12px "Microsoft Sans Serif",Tahoma,Arial,sans-serif;display:flex;flex-direction:column}
.ce-top{display:flex;align-items:center;gap:22px;padding:6px 14px 4px;flex-wrap:wrap}
.ce-info{font-size:12px;line-height:1.55}
.ce-info b{color:#00008b}
.ce-oc{display:flex;gap:6px;align-items:center;margin-top:2px}
.ce-oc input{font:12px Tahoma,Arial,sans-serif;padding:2px 4px;border:1px solid #7a7a7a;border-radius:0;width:120px;background:#fff}
.ce-btn{font:12px "Microsoft Sans Serif",Tahoma,Arial,sans-serif;background:linear-gradient(#fdfdfd,#e1e1e1);border:1px solid #adadad;border-radius:3px;padding:3px 10px;cursor:pointer;color:#000;min-width:44px}
.ce-btn:hover{border-color:#3c7fb1;background:linear-gradient(#eaf6fd,#bee6fd)}
.ce-btn:focus-visible{outline:1px dotted #000;outline-offset:-4px}
.ce-font{display:flex;gap:5px;align-items:center;font-size:12px}
.ce-font .pm{min-width:24px;padding:1px 6px}
.ce-font .v{min-width:20px;text-align:center}
.ce-font select{font:12px Tahoma,Arial,sans-serif;border-radius:0;padding:1px 2px;border:1px solid #7a7a7a}
.ce-timer{font:700 50px/1 Arial,Helvetica,sans-serif;color:#999a15;letter-spacing:1px;min-width:190px}
.ce-sp{flex:1}
.ce-saved{font-size:11px;color:#555}
.ce-x{background:none;border:1px solid transparent;font:16px/1 Arial;color:#444;cursor:pointer;padding:3px 7px}
.ce-x:hover{background:#e81123;color:#fff}
.ce-prog{display:flex;align-items:center;gap:18px;padding:8px 18px 6px 120px}
.ce-prog span{font:700 14px Verdana,Tahoma,Arial,sans-serif;color:#2020b0;white-space:nowrap}
.ce-track{flex:1;height:26px;background:#e6e6e6;border:1px solid #bcbcbc;min-width:120px}
.ce-track i{display:block;height:100%;width:0;background:#06b025;transition:width .2s}
.ce-main{display:flex;margin:0 18px 0 24px;flex:1;min-height:440px;border-top:2px solid #a0a0a0;padding-top:2px}
.ce-ans{width:100px;padding:8px 6px 0 12px;flex:none}
.ce-al{font:700 14px Verdana,Tahoma,Arial,sans-serif;color:#2020b0;margin-bottom:10px}
.ce-ans label{display:flex;align-items:center;gap:6px;margin:0 0 22px 16px;font:12px "Microsoft Sans Serif",Tahoma,Arial,sans-serif;cursor:pointer}
.ce-ans input{width:14px;height:14px;margin:0;accent-color:#2b6cd4}
.ce-nav{display:flex;gap:4px;margin:96px 0 0 -10px}
.ce-choose{width:280px;flex:none;background:#fff;border:1px solid #7a7a7a;padding:4px 8px;font:13px Arial,Helvetica,sans-serif;overflow:auto}
#ttl{max-width:84px;line-height:1.3}
.ce-choose .explain{margin-top:12px;font-size:13px;line-height:1.5;border:0;padding:0;background:none}
.ce-split{width:6px;flex:none;background:#d40000}

 focus on customer satisfaction exclusively", "To increase short-term financial performance"], 0, "Corporate branding căn chỉnh văn hóa nội bộ với hình ảnh bên ngoài (VCI).", 17, 5], ["SU25 FE", "What happens if corporate identity is not aligned with reputation?", ["Stakeholders may lose trust in the organization", "The organization's financial stability increases", "Internal operations are unaffected", "Employee satisfaction automatically increases"], 0, "Identity lệch reputation thì stakeholder mất niềm tin.", 18, 5], ["SU25 FE", "Which of the following best describes a \"strategic planning model\" in corporate communication?", ["A tool for managing financial resources", "A framework combining process and content dimensions", "A simple structure for executing social media campaigns", "A guideline for legal compliance"], 1, "Strategic planning model kết hợp hai chiều process (quá trình) và content (nội dung).", 19, 6], ["SU25 FE", "Exxon Mobil's claim of ‘taking on the world's toughest energy challenges', which invokes its superior operational efficiencies and capabilities in drilling for oil in hard-to-reach places. Which message style does Exxon Mobil adopt in the above example?", ["Pre-emptive message style", "Generic message style", "Emotional message style", "Symbolic association message style"], 0, "Exxon nhận một năng lực chung của ngành làm điểm vượt trội của mình trước đối thủ = pre-emptive.", 20, 6], ["SU25 FE", "Which of the following is NOT a typical goal of corporate communication campaigns?", ["Reducing stakeholder engagement", "Shaping public perception", "Building brand loyalty", "Enhancing corporate reputation"], 0, "Giảm engagement không bao giờ là mục tiêu của chiến dịch.", 21, 6], ["SU25 FE", "A/B testing is a type of ______.", ["Online experiment", "Differential testing", "Both of the above", "None of the above"], 0, "A/B testing (split testing) là một dạng online experiment. (Đáp án em suy luận từ giáo trình, anh nên đối chiếu thêm.)", 22, 7], ["SU25 FE", "Which principle is emphasized by the Barcelona Principles for communication measurement?", ["Focusing only on quantitative metrics", "Prioritizing the measurement of outcomes rather than outputs", "Using only traditional research methods", "Ignoring social media impact"], 1, "Barcelona Principles: đo outcomes chứ không chỉ outputs; phản đối AVE.", 23, 7], ["SU25 FE", "How should a company respond to negative reputation scores in media sentiment analysis?", ["Ignore the results and focus on product development.", "Increase advertising without changing the messaging", "Reduce corporate transparency to avoid further criticism", "Implement a revised communication strategy to address stakeholder concerns"], 3, "Điểm sentiment xấu thì điều chỉnh chiến lược truyền thông để giải quyết mối lo của stakeholder.", 24, 7], ["SU25 FE", "Which type of research is conducted to assess the overall profile and reputation of an organization in the minds of stakeholders?", ["Campaign-specific evaluation", "One-time media analysis", "Continuous reputational research", "Financial performance measurement"], 2, "Đánh giá profile và reputation tổng thể trong tâm trí stakeholder là nghiên cứu danh tiếng liên tục.", 25, 7], ["SU25 FE", "How can communication teams use the hierarchy of effects model to refine future campaigns?", ["By focusing only on the initial stages of awareness and interest", "By ignoring feedback on communication effectiveness", "By relying solely on financial outcomes", "By assessing stakeholder movement from awareness to purchase decision"], 3, "Hierarchy of effects: theo dõi stakeholder đi từ awareness đến hành động (purchase).", 26, 7], ["SU25 FE", "What does the term \"ideology\" refer to in the context of news organizations?", ["The political party affiliation of the organization", "The personal beliefs of the journalists", "A set of normative principles and values", "The technical skills required for journalism"], 2, "Ideology của tòa soạn = tập hợp các nguyên tắc chuẩn mực và giá trị.", 27, 8], ["SU25 FE", "What is the role of journalists in the news production process?", ["To design the layout of articles", "To consult sources and write news stories", "To edit news stories", "To verify the accuracy of information"], 1, "Nhà báo tìm nguồn tin và viết bài; biên tập, layout, tiêu đề do tòa soạn quyết.", 28, 8], ["SU25 FE", "Which of the following does NOT typically impact corporate reputation in media relations?", ["Positive news coverage", "Crisis response", "Framing of news stories", "Internal communication training"], 3, "Đào tạo truyền thông nội bộ không phải yếu tố media relations tác động tới reputation.", 29, 8], ["SU25 FE", "In the context of corporate communication, framing theory suggests that communication practitioners frame a decision to promote which of the following?", ["The interests of the public", "Employee opinions", "The interests of the organization", "Stakeholder neutrality"], 2, "Framing: người làm truyền thông đóng khung vấn đề để phục vụ lợi ích của tổ chức.", 30, 8], ["SU25 FE", "What is the relationship between CICS and management communication?", ["They are complementary", "They have no relationship", "Management communication is more important than CICS", "CICS are more important than management communication"], 0, "CICS và management communication bổ trợ nhau (complementary).", 31, 9], ["SU25 FE", "Employee communication in particular has a significant impact on organizational ______.", ["Identification", "Image", "Reputation", "All of the above"], 0, "Employee communication ảnh hưởng mạnh tới organizational identification.", 32, 9], ["SU25 FE", "Which term describes the organizational structures that allow employees to exert power over decision-making?", ["Employee branding", "Corporate reputation", "Employee participation", "Risk management"], 2, "Cấu trúc cho phép nhân viên có quyền trong ra quyết định = employee participation.", 33, 9], ["SU25 FE", "What distinguishes a community th the company's core values and identity", "When the CEO pressures governments on any social issue", "When employees disagree with the CEO's political stance"], 1, "CEO activism hiệu quả khi lập trường khớp với giá trị cốt lõi và bản sắc công ty.", 39, 10], ["SU25 FE", "What type of crisis is often classified as 'accidental' in crisis communication?", ["Natural disasters affecting business operations", "Financial fraud", "Being caught intentionally polluting the environment", "Negative social media reviews"], 0, "Thiên tai ảnh hưởng hoạt động thuộc nhóm accidental/victim, trách nhiệm thấp.", 40, 11], ["SU25 FE", "In the context of crisis communication, what does “scapegoating\" refer to?", ["Accepting full responsibility", "Ignoring the crisis", "Taking legal action", "Shifting blame to an external party"], 3, "Scapegoating = đổ lỗi cho bên ngoài.", 41, 11], ["SU25 FE", "What is the likely outcome for an organization with a poor reputation prior to a crisis?", ["It rebounds more quickly than reputable organizations", "It benefits from a halo effect, minimizing the impact of the crisis", "It may be stigmatized, leading to negative stakeholder perceptions and difficulty recovering", "It is unaffected by crises due to having little reputational capital to lose"], 2, "Reputation xấu trước khủng hoảng làm tổ chức bị kỳ thị, khó phục hồi (không có halo effect).", 42, 11], ["SU25 FE", "What is a key risk of using the 'distance strategy' in crisis communication?", ["It may appear unresponsive and escalate the crisis", "It reduces media exposure", "It increases organizational reputation", "It limits financial loss"], 0, "Distance strategy dễ bị coi là vô cảm, né tránh, làm khủng hoảng leo thang.", 43, 11], ["SU25 FE", "The nature of substitutive change is on a ______.", ["Small scale", "Medium scale", "Large scale", "Extremely large scale"], 2, "Substitutive change là thay đổi lớn, định nghĩa lại mission, tái cấu trúc.", 44, 12], ["SU25 FE", "What is the second step in Kotter's eight-step model of managing change?", ["Forming a guiding coalition", "Creating a vision", "Creating a sense of urgency", "Communicate the vision"], 0, "Kotter: 1 urgency, 2 guiding coalition, 3 vision...", 45, 12], ["SU25 FE", "According to John Kotter, which is the final step in his 8-step process for leading change?", ["Forming a coalition", "Creating a vision", "Generating short-term wins", "Institutionalizing new approaches"], 3, "Bước cuối của Kotter: anchor/institutionalize new approaches in the culture.", 46, 12], ["SU25 FE", "In the triple bottom line of CSR, what does the \"planet\" dimension represent?", ["Profit maximization", "Environmental responsibility", "Employee engagement", "Regulatory compliance"], 1, "Planet = trách nhiệm môi trường.", 47, 13], ["SU25 FE", "What is the primary objective of a manager in a fully developed stakeholder model?", ["To maximize profits", "To control stakeholders' interests", "To coordinate conflicting interests and values of stakeholders", "To minimize operational costs"], 2, "Trong stakeholder model đầy đủ, nhà quản lý điều phối các lợi ích xung đột.", 48, 13], ["SU25 FE", "______ communication models stress commitment to representation and consensus, rather than diversity, conflict and creativity. This may also be a reason for stakeholders to be cynical about stakeholder 'participation' or 'engagement' programmes initiated by companies.", ["Liberal democratic", "Participatory democratic", "Conflict resolution", "Two-way"], 0, "Liberal democratic models nhấn mạnh đại diện và đồng thuận; participatory democratic mới đề cao đa dạng, xung đột, sáng tạo. (Đáp án em suy luận từ giáo trình, anh nên đối chiếu thêm.)", 49, 4], ["SU25 FE", "What is the primary focus of community relations as a part of a company's CSR?", ["Internal organizational change", "Engagement with local residents", "Profit maximization", "Stakeholder management"], 1, "Community relations = gắn kết với cư dân địa phương nơi công ty hoạt động.", 50, 13], ["SU26 FE", "Which of the following is essential for maintaining consistency in corporate communication?", ["Varied messaging across departments", "Coordinating communication through a single department", "Aligning all messages with the corporate identity", "Limiting communication to senior executives"], 2, "Nhất quán = mọi thông điệp bám theo corporate identity.", 1, 1], ["SU26 FE", "What is a key trend affecting corporate communication in today's environment?", ["Decreasing importance of stakeholder engagement", "Reducing the scope of corporate communication to internal stakeholders", "Increasing complexity of managing multiple communication channels", "Eliminating the role of digital media in communication"], 2, "Xu hướng: quản lý nhiều kênh truyền thông ngày càng phức tạp.", 2, 1], ["SU26 FE", "In recent years, corporate communication has evolved to emphasize which of the following elements?", ["Disjointed, departmental, non-promotional messaging", "Engagement and transparency with stakeholders", "One-way communication from leadership", "Focus on internal communications only"], 1, "Xu hướng 2010s: engagement và minh bạch với stakeholder.", 3, 1], ["SU26 FE", "Corporate communication emerged as a professional discipline due to the convergence of which two areas?", ["Advertising and branding", "Human resources and investor relations", "Marketing communication and public relations", "Sales and customer service"], 2, "CC hình thành từ sự hội tụ của marketing communication và public relations.", 4, 2], ["SU26 FE", "What is a key challenge when implementing integrated communication?", ["Overcoming departmental silos and resistance to change", "Avoiding stakeholder interactions and feedback", "Reducing communication efforts across the organization", "Ignoring the role of digital communication channels"], 0, "Thách thức khi tích hợp: phá vỡ silo phòng ban và sự kháng cự thay đổi.", 5, 2], ["SU26 FE", "What role does corporate communication play in crisis management?", ["Maintaining secrecy during crises", "Providing clear, transparent, and timely information to stakeholders", "Limiting communication to financial stakeholders only", "Delegating communication tasks solely to the PR team"], 1, "Trong khủng hoảng, CC cung cấp thông tin rõ ràng, minh bạch, kịp thời.", 6, 2], ["SU26 FE", "The ______ structure refers to the way in which tasks and activities (and the disciplines that they represent) are divided and arranged into departments (defined as the departmental arrangement) and located in the hierarchy of authority within an organization.", ["Horizontal", "Vertical", "Cross-functional", "None of the above"], 1, "Vertical structure: cách nhiệm vụ được chia thành phòng ban và đặt trong thứ bậc quyền lực.", 7, 2], ["SU26 FE", "How has digital media changed corporate communication?", ["By increasing the speed and complexity of information flow", "By eliminating the need for traditional PR strategies", "By reducing corporate transparency", "By limiting audience engagement opportunities"], 0, "Digital media làm thông tin lan nhanh và phức tạp hơn.", 8, 3], ["SU26 FE", "How should companies integrate new media into their overall corporate communication strategies?", ["By limiting its use to specific campaigns", "By ensuring that new media efforts are aligned with the overall corporate identity and goals", "By replacing traditional media completely", "By avoiding stakeholder involvement in content creation"], 1, "New media phải thống nhất với identity và mục tiêu tổng thể.", 9, 3], ["SU26 FE", "How do organizations use priming or nudging on social media?", ["To directly persuade individuals to support the organization.", "To force individuals to create content for the organization.", "To mobilize individuals to produce and share content in favor of the organization.", "To provide clear instructions on how individuals should support the organization."], 2, "Priming/nudging: khuyến khích cá nhân tự tạo và chia sẻ nội dung có lợi cho tổ chức.", 10, 3], ["SU26 FE", "In the input-output model, what role do stakeholders play?", ["Suppliers of resources", "Part of a mutual relationship", "Passive recipients of information", "External influencers"], 0, "Input–output model (neo-classical): stakeholder như investor, employee, supplier chỉ là nguồn cung đầu vào.", 11, 4], ["SU26 FE", "What is a primary goal of Corporate Social Responsibility (CSR) initiatives in the stakeholder management model?", ["To create societal value and sustainability", "To maximize shareholder value", "To increase short-term sales", "To reduce operational costs"], 0, "CSR trong stakeholder model nhằm tạo giá trị cho xã hội và phát triển bền vững.", 12, 4], ["SU26 FE", "In the context of stakeholder management, what is the primary purpose of using the dialogue strategy?", ["To advertise products and services", "To build mutual understanding and engagement", "To gather competitive intelligence", "To limit stakeholder influence"], 1, "Dialogue strategy để xây dựng hiểu biết lẫn nhau và gắn kết.", 13, 4], ["SU26 FE", "Which type of stakeholders is most likely to receive defensive strategies?", ["Non-supportive stakeholders", "Mixed blessing stakeholders", "Supportive stakeholders", "Marginal stakeholders"], 0, "Savage et al.: stakeholder non-supportive → defend (chiến lược phòng thủ).", 14, 4], ["SU26 FE", "How does effective stakeholder engagement contribute to the success of CSR initiatives?", ["It minimizes communication with internal stakeholders", "It ensures that only financial stakeholders are prioritized", "It enhances the organization's ability to align business objectives with social expectations", "It increases marketing costs"], 2, "Gắn kết stakeholder giúp căn chỉnh mục tiêu kinh doanh với kỳ vọng xã hội.", 15, 4], ["SU26 FE", "How does a strong alignment between corporate identity and stakeholder perceptions impact an organization?", ["It reduces the need for external communication", "It strengthens stakeholder loyalty and trust", "It decreases internal marketing efforts", "It focuses only on internal stakeholders"], 1, "Identity khớp nhận thức stakeholder thì củng cố niềm tin, lòng trung thành.", 16, 5], ["SU26 FE", "When Tesco, a UK retailer, announced its sponsorship of Cancer Research UK, it provided people with information regarding the decision about its sponsorship (to fund research into the prevention, treatment and cure of cancer) and tied the sponsorship to the promotion of its Healthy Living range of products to support a healthy lifestyle. At the same time, through the sponsorship, the company aimed to project an image of itself as a caring and responsible corporate citizen contributing to the fight against one of the deadliest diseases around. In the context of corporate communication, what does the Tesco example illustrate?", ["The exclusive focus on information dissemination", "The separation of symbolic and informational communication strategies", "The ineffectiveness of corporate sponsorships", "The blending of informational and symbolic dimensions in communication"], 3, "Tesco vừa cung cấp thông tin (informational) vừa xây hình ảnh công dân tốt (symbolic).", 17, 5], ["SU26 FE", "Which of the following is a benefit of a strong corporate reputation?", ["Reduced need for employee training", "Increased stakeholder trust and loyalty", "Decreased brand visibility", "Lower production costs"], 1, "Reputation mạnh mang lại niềm tin và lòng trung thành của stakeholder.", 18, 5], ["SU26 FE", "What does the ‘authenticity' attribute in corporate communication refer to?", ["The degree to which the organization's values are embedded in its culture", "The financial stability of the organization", "The number of market segments targeted", "The organization's market share"], 0, "Authenticity = giá trị tổ chức thực sự thấm vào văn hóa.", 19, 5], ["SU26 FE", "All of the following are key steps in developing a communication strategy EXCEPT:", ["Identifying the target audience", "Establishing clear objectives", "Planning content platforms", "Selecting random communication methods"], 3, "Chọn phương pháp ngẫu nhiên không phải bước lập chiến lược.", 20, 6], ["SU26 FE", "How does pre-emptive messaging contribute to competitive advantage in communication?", ["By responding to competitors' claims only after their launch", "By focusing solely on internal communication", "By establishing a unique position before competitors can make similar claims", "By highlighting financial performance over communication"], 2, "Pre-emptive: chiếm vị trí độc đáo trước khi đối thủ đưa ra tuyên bố tương tự.", 21, 6], ["SU26 FE", "An organization is preparing a major product launch and aims to use an integrated communication strategy. The team is considering several communication channels including social media, traditional media, and direct email campaigns. How should the communication team structure their integrated communication plan to ensure consistency and maximum impact?", ["Focus on using one primary communication channel to avoid confusion", "Develop a unified core message that is adapted slightly to fit each communication channel's audience", "Use different messages for each communication channel to cover various perspectives", "Prioritize traditional media over newer platforms, as it has a broader reach"], 1, "Integrated: một core message thống nhất, điều chỉnh nhẹ cho từng kênh.", 22, 6], ["SU26 FE", "What should communication practitioners focus on when adjusting a campaign mid-execution?", ["Corporate vision only", "Long-term goals, avoiding immediate feedback", "Stakeholder responses and real-time metrics", "Financial performance exclusively"], 2, "Điều chỉnh giữa chừng dựa trên phản hồi stakeholder và số liệu thời gian thực.", 23, 6], ["SU26 FE", "What is the key advantage of using focus groups in communication research?", ["It offers in-depth insights into stakeholders' perceptions and attitudes", "It provides large-scale numerical data", "It is faster function examSetup(){
  const papers=CFG.examPapers;
  $("#home").innerHTML=`<div class="setup">
   <div class="signin"><div class="pill">Thi thử</div>
     <label class="fld"><span>Đề thi (Exam code)</span><select id="src">${SRC_OPTS()}</select></label>
     <label class="fld"><span>Số câu</span><select id="n"><option>20</option><option>30</option><option selected>50</option><option>60</option><option value="9999">Tất cả</option></select></label>
     <label class="fld"><span>Thời gian (Duration)</span><select id="t"><option value="0">Không giới hạn</option><option value="30">30 phút</option><option value="45">45 phút</option><option value="60" selected>60 phút</option><option value="90">90 phút</option></select></label>
     <label class="ck"><input type="checkbox" id="ord"> Giữ thứ tự gốc của đề</label>
     <label class="ck"><input type="checkbox" id="grd"> Hiện bảng số câu (bản EOS thật không có)</label>
     <button class="btn pri" id="go">Sign in · Vào phòng thi</button>
     ${S&&!S.done?`<button class="btn" id="resume">Làm tiếp bài đang dở (${Object.keys(S.pick).length}/${S.ids.length} câu)</button>`:""}
   </div>
   <div class="steps"><b>Trình tự giống NEW EOS (Ver.2)</b>
     <ol><li>Nhập <b>Open Code</b> (ở đây gõ gì cũng được) rồi bấm <b>Show Question</b>. Đồng hồ <b>Time Left</b> bắt đầu chạy.</li>
     <li>Chỉnh <b>Size</b> (cỡ chữ đề), <b>UI</b> (cỡ chữ giao diện), <b>Font</b> ở thanh phía trên nếu cần.</li>
     <li>Tích đáp án ở cột <b>Answer</b>, chuyển câu bằng <b>Prev Question / Next Question</b> hoặc phím ← →. Trạng thái <b>Saved</b> cập nhật sau mỗi lần chọn.</li>
     <li>Bấm <b>Finish (Submit)</b>, đọc hộp <b>Finish the exam</b> (báo số câu còn trống), tích xác nhận rồi <b>Finish (Submit)</b>.</li>
     <li>Màn hình báo <b>The exam has been submitted.</b> Ở bản ôn này anh xem điểm và giải thích ngay bên dưới.</li></ol>
     <p class="hint">${CFG.examNote}</p></div></div>`;
  $("#go").onclick=()=>{
    const s=$("#src").value;
    let pool=Q.map((_,i)=>i).filter(i=>inSrc(s,i));
    const keep=$("#ord").checked&&papers.includes(s);
    if(!keep)for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
    pool=pool.slice(0,Math.min(+$("#n").value,pool.length));
    const opt=$("#src").selectedOptions[0].textContent;
    S={ids:pool,pick:{},cur:0,mins:+$("#t").value,end:0,shown:false,done:false,grid:$("#grd").checked,saved:"",code:s,name:opt};save();exam();
  };
  const r=$("#resume");if(r)r.onclick=exam;
}

let CH_CCO = [
{n:1,t:"Defining Corporate Communication",h:`
<h3>Định nghĩa (thuộc lòng)</h3>
<p>Corporate communication là <mark>a management function</mark> cung cấp khung để <mark>phối hợp hiệu quả mọi truyền thông nội bộ và bên ngoài</mark>, với mục đích tổng thể là <mark>xây dựng và duy trì danh tiếng thuận lợi (favourable reputations)</mark> với các nhóm stakeholder mà tổ chức phụ thuộc vào.</p>
<h3>Các khái niệm then chốt (ví dụ British Airways)</h3>
<div class="tw"><table><tr><th>Khái niệm</th><th>Định nghĩa ngắn</th></tr>
<tr><td>Mission</td><td>Mục đích bao trùm, phù hợp với giá trị và kỳ vọng của stakeholder</td></tr>
<tr><td>Vision</td><td>Trạng thái tương lai mong muốn, khát vọng của tổ chức</td></tr>
<tr><td>Corporate objectives</td><td>Tuyên bố mục tiêu tổng thể phù hợp với mục đích</td></tr>
<tr><td>Strategies</td><td>Cách thức/phương tiện để đạt objectives</td></tr>
<tr><td>Corporate identity</td><td>Hồ sơ (profile) và giá trị mà tổ chức <mark>truyền đi</mark> ("The world's favourite airline")</td></tr>
<tr><td>Corporate image</td><td>Tập liên tưởng tức thời của một cá nhân <mark>tại một thời điểm</mark> khi nhận tín hiệu về tổ chức</td></tr>
<tr><td>Corporate reputation</td><td>Biểu hiện tập hợp các image trong quá khứ, <mark>hình thành theo thời gian</mark></td></tr>
<tr><td>Stakeholder</td><td>Bất kỳ nhóm/cá nhân nào có thể ảnh hưởng hoặc bị ảnh hưởng bởi việc đạt mục tiêu của tổ chức</td></tr>
<tr><td>Market</td><td>Nhóm xác định có nhu cầu với sản phẩm</td></tr>
<tr><td>Communication</td><td>Chiến thuật và phương tiện dùng để giao tiếp với nhóm trong/ngoài</td></tr>
<tr><td>Integration</td><td>Phối hợp mọi truyền thông để identity được truyền đạt nhất quán, hiệu quả</td></tr></table></div>
<h3>Xu hướng theo thời gian</h3>
<ul><li><b>1980s:</b> chuyển từ "PR/marketing riêng lẻ" sang tích hợp dưới một chức năng quản trị (corporate communication).</li>
<li><b>1990s/2000s:</b> tập trung reputation management. <b>Điểm yếu:</b> tạo ấn tượng stakeholder có thể bị "quản lý/kiểm soát", mô hình truyền thông tuyến tính, coi stakeholder là bị động.</li>
<li><b>2010s:</b> stakeholder chủ động (lên tiếng, tự tổ chức, vận động), nhờ new media; chuyển sang <mark>engagement</mark>: minh bạch, hành xử đúng bản sắc ("acting in character"), biến stakeholder thành advocate thật sự.</li></ul>
<p>Yếu tố làm CC phức tạp: phạm vi địa lý rộng, nhiều sản phẩm/dịch vụ, nhiều division/business unit.</p>
<div class="trap"><b>Bẫy hay gặp:</b> Image = tức thời, một thời điểm. Reputation = tích lũy theo thời gian. Identity = cái tổ chức tự thể hiện ra.</div>`},
{n:2,t:"CC in Contemporary Organizations",h:`
<h3>Lịch sử</h3>
<ul><li><b>Cách mạng công nghiệp – 1930s:</b> thời "The public be damned": publicity, quảng bá phóng đại tới mức dối trá, do press agents/propagandists làm, không ai giám sát.</li>
<li><b>Đầu thế kỷ 20:</b> <mark>Muckrakers</mark> (nhà báo điều tra) phanh phui bê bối → doanh nghiệp thuê nhà báo cũ làm spokesperson; thị trường bão hòa → thuê advertising agents.</li>
<li><b>1920–1930:</b> công chúng hoài nghi big business → đưa chuyên gia vào nội bộ; <mark>PR và marketing</mark> tách thành hai ngành "external" riêng.</li></ul>
<h3>Marketing vs PR</h3>
<ul><li>Marketing: lo <mark>markets</mark> (sense, serve, satisfy customer needs at a profit).</li>
<li>PR: lo <mark>publics</mark> (tạo goodwill để công chúng không cản trở việc kiếm lợi nhuận).</li>
<li>Từ 1980s tích hợp, khởi xướng bởi <mark>Kotler & Mindak (1978)</mark> với 5 mô hình quan hệ: separate but equal; equal but overlapping; marketing dominant; PR dominant; marketing and PR as the same function. Marketing PR (MPR) ví dụ The Body Shop, Starbucks.</li></ul>
<h3>Ba nhóm động lực tích hợp (drivers for integration)</h3>
<div class="tw"><table><tr><th>Nhóm</th><th>Nội dung</th></tr>
<tr><td>Market & environment-based</td><td>Vai trò stakeholder chồng lấn; truyền thông nội bộ không tách khỏi bên ngoài; đòi hỏi minh bạch</td></tr>
<tr><td>Communication-based</td><td>Message clutter; nhất quán làm tăng hiệu quả; media bổ trợ, chi phí media tăng; nhiều kênh cần kiểm soát</td></tr>
<tr><td>Organizational</td><td>Hiệu quả; trách nhiệm giải trình (accountability); định hướng chiến lược qua hợp nhất; điểm chung giữa các ngành</td></tr></table></div>
<h3>Tổ chức bộ phận CC</h3>
<ul><li><b>Vertical structure:</b> dùng ở công ty đa ngành/đa quốc gia; staff function ở HQ, nối trực tiếp CEO, người đứng đầu CC thường có ghế ở board.</li>
<li><b>Horizontal structure:</b> phản ứng nhanh với issue, nhất quán thông điệp, làm việc liên chức năng, tránh "silos" và turf wars.</li>
<li>Cơ chế ngang: multi-disciplinary team, standardized work processes, <mark>council meetings</mark> (hợp tác, chia sẻ best practice, không phải diễn đàn kiểm soát), natural work team, <mark>taskforce team</mark> (ad hoc: khủng hoảng, tái cấu trúc).</li>
<li><b>Communication guidelines:</b> house style book, brand book (ví dụ Ericsson), quy định logo, màu PMS.</li></ul>`},
{n:3,t:"CC in a Changing Media Environment",h:`
<h3>Thay đổi lớn</h3>
<ul><li>Từ <mark>command and control</mark> (tổ chức kiểm soát thông điệp) sang <mark>communication and community</mark> (đối thoại tự do, "dân chủ hóa" media).</li>
<li>Thách thức: khó kiểm soát thông điệp, tin tức phân mảnh. Cơ hội: kênh mới để tiếp cận, đối thoại, giọng nói chân thực (authentic voice), kể chuyện.</li>
<li>Nhân viên cũng thành "người làm truyền thông"; điện thoại có camera tạo ra <mark>citizen journalists</mark>.</li></ul>
<h3>Thuật ngữ</h3>
<ul><li><b>Social media</b> (Kaplan & Haenlein, 2010): nhóm ứng dụng Internet xây trên nền tảng tư tưởng và công nghệ của Web 2.0, cho phép tạo và trao đổi <mark>user-generated content</mark>.</li>
<li><b>Web 2.0:</b> sự chuyển dịch về tư tưởng và công nghệ trong cách dùng online; là <mark>nền tảng</mark> cho social media.</li>
<li><b>Owned / Paid / Earned media:</b> owned = kênh của công ty (website, fanpage); paid = trả tiền (quảng cáo); earned = được nhắc đến miễn phí (báo chí, chia sẻ, WOM).</li></ul>
<h3>Phân loại social media (Kaplan & Haenlein)</h3>
<p>Hai trục: <mark>social presence/media richness</mark> (thấp–vừa–cao) × <mark>self-presentation/self-disclosure</mark> (thấp–cao).</p>
<div class="tw"><table><tr><th></th><th>Richness thấp</th><th>Vừa</th><th>Cao</th></tr>
<tr><td>Self-presentation cao</td><td>Blogs</td><td>Social networking sites (Facebook)</td><td>Virtual social worlds (Second Life)</td></tr>
<tr><td>Self-presentation thấp</td><td>Collaborative projects (Wikipedia)</td><td>Content communities (YouTube)</td><td>Virtual game worlds (WoW)</td></tr></table></div>
<ul><li><b>Blogs:</b> CC phải theo dõi blogger có ảnh hưởng; corporate blog, <mark>spokesblogger</mark>; 73% nhà báo dùng blog khi tìm tin (PR Week 2008). Ví dụ Robert Scoble (Microsoft).</li>
<li><b>Collaborative projects:</b> wiki, social bookmarking; wiki nội bộ (Cisco, IBM).</li>
<li><b>Content communities:</b> YouTube; rủi ro bản quyền, video tiêu cực (<b>United Breaks Guitars</b>).</li></ul>`},
{n:4,t:"Stakeholder Management & Communication",h:`
<h3>Hai quan điểm</h3>
<ul><li><b>Neo-classical theory:</b> mục đích là lợi nhuận, chỉ chịu trách nhiệm với bản thân và cổ đông (shareholder).</li>
<li><b>Socio-economic theory:</b> nhiều nhóm khác cũng quan trọng; trách nhiệm mở rộng tới các nhóm cần cho sự tồn tại của tổ chức và phúc lợi xã hội → nền của <mark>stakeholder model</mark> và CSR.</li></ul>
<p><b>Stakeholder</b> (Freeman, 1984): nhóm/cá nhân có thể ảnh hưởng hoặc bị ảnh hưởng bởi việc đạt mục tiêu. <mark>Stake</mark> (Carroll, 1996): từ một mối quan tâm đơn thuần đến quyền sở hữu hợp pháp.</p>
<h3>Phân loại</h3>
<div class="tw"><table><tr><th>Loại stake (Freeman)</th><th>Ví dụ</th></tr>
<tr><td>Equity stakes: sở hữu trực tiếp</td><td>Shareholders, directors</td></tr>
<tr><td>Economic/market stakes: lợi ích kinh tế, không sở hữu</td><td>Employees, customers, suppliers, competitors</td></tr>
<tr><td>Influencer stakes: không có hai loại trên nhưng có quan tâm</td><td>Consumer advocates, environmental groups, government agencies</td></tr></table></div>
<ul><li><b>Primary:</b> thiếu họ tổ chức không tồn tại (employees, suppliers, consumers). <b>Secondary:</b> không giao dịch tài chính nhưng có lợi ích đạo đức, có thể huy động dư luận (media, special interest groups).</li>
<li><b>Contractual vs Community</b> (Charkham, 1992): contractual = customers, employees, distributors, suppliers, shareholders, lenders; community = consumers, regulators, government, media, local communities, pressure groups.</li></ul>
<h3>Stakeholder salience model (Mitchell, Agle & Wood, 1997)</h3>
<p>Ba thuộc tính: <mark>Power, Legitimacy, Urgency</mark>.</p>
<div class="tw"><table><tr><th>Nhóm</th><th>Thuộc tính</th></tr>
<tr><td>Latent (1): Dormant / Discretionary / Demanding</td><td>Power / Legitimacy / Urgency</td></tr>
<tr><td>Expectant (2): Dominant / Dangerous / Dependent</td><td>P+L / P+U / L+U</td></tr>
<tr><td>Definitive (3)</td><td>P+L+U: ưu tiên cao nhất</td></tr></table></div>
<h3>Power–interest matrix (Mendelow)</h3>
<ul><li>Low power, low interest → <mark>minimal effort</mark></li><li>Low power, high interest → <mark>keep informed</mark></li><li>High power, low interest → <mark>keep satisfied</mark></li><li>High power, high interest → <mark>key players</mark></li></ul>
<h3>Mô hình truyền thông tổ chức–stakeholder</h3>
<div class="tw"><table><tr><th>Strategy</th><th>Mô hình</th><th>Mục tiêu</th></tr>
<tr><td>Information strategy</td><td>One-way (public information)</td><td>Thông báo, tạo awareness</td></tr>
<tr><td>Persuasive strategy</td><td>Two-way asymmetrical</td><td>Thuyết phục thay đổi thái độ/hành vi</td></tr>
<tr><td>Dialogue strategy</td><td>Two-way symmetrical</td><td>Đối thoại, hiểu nhau, cùng thay đổi</td></tr></table></div>
<p>Hướng mới: từ <mark>"management" → "collaboration"</mark>, từ <mark>"exchange" → "long-term relationships"</mark>; collaboration ngụ ý two-way symmetrical. Truyền thông đi từ <mark>awareness → commitment</mark>.</p>
<div class="trap"><b>Bẫy:</b> Dangerous = Power + Urgency (không có legitimacy). Dependent = Legitimacy + Urgency (không có power, phải dựa vào nhóm khác).</div>`},
{n:5,t:"Corporate Identity, Branding & Reputation",h:`
<ul><li>Corporate identity: <mark>chủ động thể hiện hình ảnh tích cực</mark> để xây, duy trì, bảo vệ danh tiếng → stakeholder chấp nhận, ủng hộ → <mark>"first-choice status"</mark> với nhà đầu tư, khách hàng, nhân viên.</li>
<li>Ban đầu identity chỉ là logo, thiết kế; nay bao gồm mọi hình thức truyền thông và cả <mark>đặc điểm nội tại</mark> của công ty.</li></ul>
<h3>Mô hình Birkigt & Stadler (1986)</h3>
<p><b>Corporate personality</b> được biểu hiện qua <mark>symbolism, communication, behaviour</mark> (corporate identity mix) → tạo ra <mark>corporate image</mark> nơi stakeholder.</p>
<h3>Identity structure</h3>
<div class="tw"><table><tr><th>Loại</th><th>Đặc điểm</th><th>Ví dụ</th></tr>
<tr><td>Monolithic</td><td>Một tên chung cho mọi sản phẩm</td><td>Sony, BMW, Virgin, Philips</td></tr>
<tr><td>Endorsed</td><td>Brand con được "bảo chứng" bởi tên công ty mẹ</td><td>GM, Kellogg, Nestlé, Cadbury</td></tr>
<tr><td>Branded</td><td>Mỗi brand tên riêng, như không liên quan nhau</td><td>P&G (Ariel), Unilever (Dove), Electrolux (Zanussi)</td></tr></table></div>
<h3>VCI alignment toolkit (Hatch & Schultz, 2001)</h3>
<ul><li><b>Vision:</b> <mark>khát vọng của lãnh đạo cấp cao</mark>.</li><li><b>Culture:</b> <mark>giá trị mà nhân viên cảm nhận và chia sẻ</mark>.</li><li><b>Image:</b> <mark>ấn tượng của stakeholder bên ngoài</mark>.</li></ul>
<p>Ba khoảng cách cần kiểm tra: vision–culture (tổ chức có thực hành giá trị mình rao giảng? vision có truyền cảm hứng cho mọi subculture?), culture–image, image–vision (có truyền đạt vision tới stakeholder hiệu quả?).</p>
<p>Ví dụ: BA bỏ thiết kế mang tính di sản truyền thống (đuôi máy bay "ethnic") → tranh cãi. Case Biti's: vision "tự hào Việt Nam" nhưng hành vi nhập vải Trung Quốc → <mark>đứt gãy VCI</mark>.</p>`},
{n:6,t:"Communication Strategy & Planning",h:`
<ul><li>Chiến lược truyền thông: đưa reputation của stakeholder về gần <mark>vision</mark>, hoặc củng cố reputation nếu đã phù hợp.</li>
<li><b>Strategic intent:</b> sự thay đổi hoặc củng cố (consolidation) reputation mong muốn, dựa trên <mark>reputation–vision gap</mark>.</li></ul>
<h3>Ba paradigm về quá trình làm chiến lược</h3>
<p><b>Rational planning</b> (có kế hoạch, tuyến tính) · <mark>Intuitive/visionary</mark> (dựa vào tầm nhìn người lãnh đạo) · <mark>Incremental/emergent</mark> (hình thành dần). Thực tế là kết hợp planned + emergent.</p>
<h3>Vai trò người làm truyền thông</h3>
<ul><li><b>Communication technician:</b> không tham gia ra quyết định chiến lược, chủ yếu thực thi.</li><li><b>Communication manager:</b> ra quyết định chiến lược/chính sách, chịu trách nhiệm thành bại của chương trình.</li></ul>
<h3>Message styles (5 kiểu)</h3>
<div class="tw"><table><tr><th>Định hướng</th><th>Style</th></tr>
<tr><td>Functional orientation</td><td>Rational message style (lý lẽ, thông tin, lợi ích thực tế)</td></tr>
<tr><td>Symbolic orientation</td><td>Symbolic association (gắn với biểu tượng/giá trị), Emotional (cảm xúc)</td></tr>
<tr><td>Industry orientation</td><td>Generic (thông điệp chung của ngành), Pre-emptive (tuyên bố trước điều mà đối thủ cũng có)</td></tr></table></div>
<h3>Programme vs Campaign</h3>
<ul><li><b>Programme:</b> tập hoạt động hướng tới nhiều đối tượng trong/ngoài, <mark>không có điểm kết thúc định trước</mark>.</li><li><b>Campaign:</b> dùng truyền thông qua trung gian (mass media) tới đối tượng cụ thể, <mark>giới hạn trong một thời điểm</mark>.</li></ul>
<h3>7 bước lập kế hoạch</h3>
<p>1 Strategic intent → 2 Communication objectives (càng chặt càng tốt, SMART) → 3 Identify & prioritize target audiences (salience model, power–interest) → 4 Themed messages → 5 Message styles → 6 Media strategy → 7 Budget (phần lớn chi cho media buying; có thể phải quay lại chỉnh các bước trước).</p>`},
{n:7,t:"Research & Measurement",h:`
<ul><li>Research là nền tảng của CC chuyên nghiệp: chứng minh chiến dịch có hiệu quả, ghi nhận reputation, giúp CC được ban lãnh đạo coi trọng và tham gia quyết định chiến lược.</li>
<li><b>Informal research:</b> trao đổi không chính thức với stakeholder, chuyên gia. <b>Formal research:</b> có hệ thống, quan tâm tính đại diện của mẫu: focus groups (định tính), surveys (bảng hỏi cấu trúc, thống kê), content analysis (phân tích định lượng tài liệu truyền thông).</li>
<li>Research & evaluation là một <mark>vòng tròn (cycle)</mark>, không chỉ trước hoặc sau chiến dịch; quan trọng nhất là đo <mark>impact level</mark>.</li></ul>
<h3>Đo reputation</h3>
<ul><li>Hai loại: <mark>publicly syndicated rankings</mark> (Fortune's Most Admired, RepTrak/Reputation Quotient) và <mark>company-specific reputation research</mark>.</li>
<li>Phương pháp định tính: Kelly repertory grid, natural grouping, laddering, photo-sort…</li></ul>
<h3>Ba giai đoạn đánh giá (Cutlip, Center & Broom)</h3>
<p><b>Preparation</b> (thông tin nền có đủ, nội dung thông điệp phù hợp?) → <mark>Implementation</mark> (bao nhiêu thông điệp được gửi, bao nhiêu người nhận/chú ý?) → <mark>Impact</mark> (bao nhiêu người hiểu, thay đổi thái độ, hành vi?).</p>
<h3>Outputs – Outtakes – Outcomes</h3>
<ul><li><b>Outputs:</b> số bài báo, bài đăng, reach (bề nổi).</li><li><b>Outtakes:</b> sự chú ý, hiểu, phản hồi ban đầu (vd Net Sentiment).</li><li><b>Outcomes:</b> thay đổi hành vi, tác động kinh doanh (doanh số, niềm tin dài hạn).</li></ul>
<h3>Thuyết phục</h3>
<ul><li>Mendelsohn (1973): đặt mục tiêu hợp lý, dựa trên hiểu biết về mức awareness, belief, behaviour hiện tại.</li>
<li><b>Hierarchy of effects</b> (Lavidge & Steiner): awareness → knowledge (cognitive) → liking → preference (affective) → conviction → purchase (conative/behaviour).</li>
<li>Thay thế: <b>Framing</b>: kích hoạt frame bằng từ khóa, lập luận trong frame, gắn với phạm trù văn hóa chung.</li></ul>`},
{n:8,t:"Media Relations",h:`
<ul><li>Media là kênh quan trọng tới công chúng: tạo publicity và đưa tin kinh doanh ảnh hưởng stakeholder.</li>
<li>Nhà báo <mark>kiểm soát hạn chế</mark>: không quyết định bài in cuối cùng, đoạn mở đầu, layout, hình ảnh, tiêu đề.</li>
<li>Tin tức phản ánh ý thức hệ/chính trị của tòa soạn (NY Post = editors' paper, Washington Post = reporter's paper).</li>
<li><b>Amplification:</b> đưa tin "khuếch đại" danh tiếng (tốt và xấu): làm nổi bật issue, củng cố quan điểm sẵn có.</li></ul>
<h3>Agenda-setting theory</h3>
<p>Tần suất media đưa tin quyết định <mark>mức độ nổi bật (salience)</mark> của issue trong tâm trí công chúng. Hai cấp: <mark>(1) salience của tổ chức</mark>; <mark>(2) attributes/associations</mark> gắn với tổ chức (facts, quan sát trung lập, cảm xúc qua stance và tone).</p>
<h3>Agenda building</h3>
<p>Tổ chức ảnh hưởng agenda của media qua <mark>information subsidies</mark>: họp báo, thông cáo báo chí, chiến dịch. Có tới <mark>80%</mark> tin về doanh nghiệp được khởi nguồn từ người làm CC. Media và tổ chức <mark>phụ thuộc lẫn nhau (interdependent)</mark>.</p>
<h3>Framing</h3><p>Cách tổ chức muốn câu chuyện được kể; CC phải làm nhà báo quan tâm và giữ câu chuyện đúng frame mong muốn.</p>
<h3>Công cụ</h3>
<ul><li>Phát tin: press release, press conference, interviews.</li><li>Monitoring: <mark>gate-keeping research</mark>, <mark>output analysis</mark>, syndicated media monitoring services.</li><li><b>Online newsroom</b> (vd L'Oréal): nội dung dễ tìm, dễ truy cập cho nhà báo.</li></ul>`},
{n:9,t:"Employee Communication",h:`
<p>Đồng nghĩa: employee / staff / internal communication. Công nghệ khiến truyền thông nội bộ không còn "ở trong": nhân viên có thể đăng blog, phàn nàn công khai, không qua gatekeeper.</p>
<h3>Hai loại</h3>
<ul><li><b>Management communication:</b> <mark>giữa quản lý và cấp dưới</mark> (face-to-face, email, video). CC hỗ trợ, tư vấn quản lý.</li>
<li><b>Corporate information & communication systems (CICS):</b> phát (broadcast) quyết định và diễn biến của công ty <mark>tới toàn bộ nhân viên</mark> qua intranet, email, <mark>town hall meetings</mark>; do bộ phận truyền thông phụ trách.</li></ul>
<h3>Chiều truyền thông</h3>
<ul><li><b>Downward:</b> từ trên xuống, <mark>tập trung vào điều quan trọng (mission)</mark> và được coi trọng (policies). Ví dụ Siemens calendar system.</li><li><b>Upward:</b> từ nhân viên lên quản lý, <mark>giúp lợi nhuận và hiệu suất</mark>.</li></ul>
<h3>Organizational identification</h3>
<p>Cảm nhận "là một" hoặc <mark>thuộc về tổ chức, tự định nghĩa mình qua tổ chức</mark>. Nhân viên tự hào khi tổ chức có danh tiếng (tăng self-esteem); identification mạnh hơn khi <mark>giá trị cá nhân khớp với organizational identity</mark>. Cân bằng giữa thông tin chung về công ty và thông tin liên quan trực tiếp tới công việc giúp tăng identification.</p>
<h3>Voice và silence</h3>
<ul><li><b>Voice/participation:</b> <mark>mức nhân viên lên tiếng, được lắng nghe</mark>, tham gia ra quyết định (vd John Lewis).</li>
<li><b>Organizational silence</b> (Morrison & Milliken, 2000): <mark>nhân viên giữ lại thông tin về vấn đề</mark>. Hệ quả: chặn phản hồi tiêu cực, không phát hiện/sửa lỗi, lỗi kéo dài, quyết định kém, nhân viên thấy không được coi trọng, ít identify với tổ chức.</li>
<li><b>Communication climate:</b> supportive/open vs defensive/closed. Nền tảng số (Cisco, Dell, GM) cho đối thoại nội bộ.</li></ul>
<h3>Mạng lưới</h3><p><b>Production networks</b> (công việc, đổi mới) · <mark>Maintenance networks</mark> (quan hệ xã hội) · <mark>Communities of practice</mark> (chung mối quan tâm nghề nghiệp: HP learning communities, Xerox family groups, World Bank thematic groups, BP peer groups).</p>`},
{n:10,t:"Issues Management",h:`
<ul><li><b>Issue:</b> mối quan tâm của công chúng về quyết định/hoạt động của tổ chức, có thể là điểm xung đột ý kiến; một vấn đề <mark>chưa ngã ngũ, sẵn sàng để quyết định</mark> (vd bê bối đồ chơi Mattel).</li>
<li><b>Crisis:</b> issue đòi hỏi hành động <mark>quyết đoán và tức thời</mark>. Issue khi "active" có thể leo thang thành crisis.</li></ul>
<h3>Quy trình 4 bước</h3>
<p>Environmental scanning → Issue identification & analysis → Issue-specific response strategies → Evaluation.</p>
<ul><li>Scanning: <b>DESTEP</b> (Demographic, Economic, Social, Technological, Ecological, Political) và <b>SWOT</b>.</li>
<li>Phân tích: xác định cường độ issue; <mark>position–importance matrix</mark> (stakeholder ủng hộ hay phản đối, issue quan trọng thế nào với họ) cho ra nhóm Supporter, Low priority, Problematic, Antagonistic.</li>
<li><b>Life cycle of an issue:</b> early (emerging) → current → crisis → dormant. Càng sớm càng dễ tác động.</li></ul>
<h3>Ba chiến lược phản hồi issue</h3>
<div class="tw"><table><tr><th>Strategy</th><th>Ý nghĩa</th></tr>
<tr><td>Buffering</td><td>"Stonewall" issue, trì hoãn sự phát triển của nó</td></tr>
<tr><td>Bridging</td><td>Cởi mở với thay đổi, thừa nhận issue và tính tất yếu của nó</td></tr>
<tr><td>Advocacy</td><td>Cố thay đổi kỳ vọng của stakeholder và dư luận qua issue campaigns, lobbying</td></tr></table></div>
<p>Chọn chiến lược tùy: cường độ issue, tầm quan trọng với stakeholder, giá trị/niềm tin của nhà quản lý. Ví dụ các hãng dầu và biến đổi khí hậu.</p>
<div class="trap"><b>Bẫy:</b> Bridging = chấp nhận và thích nghi; Advocacy = chủ động thay đổi dư luận; Buffering = né, câu giờ.</div>`},
{n:11,t:"Crisis Communication",h:`
<h3>Crisis type matrix</h3>
<div class="tw"><table><tr><th></th><th>Unintentional</th><th>Intentional</th></tr>
<tr><td><b>External</b></td><td>Faux pas</td><td>Terrorism</td></tr>
<tr><td><b>Internal</b></td><td>Accidents</td><td>Transgressions</td></tr></table></div>
<h3>Nhóm chiến lược phản hồi (từ phòng thủ đến nhận lỗi)</h3>
<div class="tw"><table><tr><th>Nhóm</th><th>Chiến thuật</th></tr>
<tr><td>Nonexistence</td><td>Denial, clarification, attack (người tố cáo), intimidation</td></tr>
<tr><td>Distance</td><td>Excuse, justification (thừa nhận khủng hoảng nhưng giảm liên hệ/trách nhiệm)</td></tr>
<tr><td>Association</td><td>Bolstering (nhắc điều tốt trước đây), transcendence, praising others; <mark>suffering</mark> và <mark>victimization</mark> (tổ chức cũng là nạn nhân)</td></tr>
<tr><td>Acceptance & accommodation</td><td>Full apology, remediation (bồi thường), repentance, rectification (sửa sai để không tái diễn)</td></tr></table></div>
<ul><li>Natural accidents (vô ý, ngoài kiểm soát) → <mark>distance</mark>.</li><li>Transgressions (cố ý, do tổ chức) → <mark>acceptance</mark>.</li><li>Terrorism (tác nhân bên ngoài) → <mark>suffering</mark> (nạn nhân bất công).</li></ul>
<h3>SCCT (Coombs) — từ tài liệu tổng hợp</h3>
<ul><li>Victim cluster (tin đồn, thiên tai): trách nhiệm thấp. Accidental (lỗi kỹ thuật): trung bình. Preventable (lỗi con người, quy trình): cao nhất.</li>
<li>Deny / Diminish / Rebuild (+ Bolstering phụ trợ). Preventable bắt buộc <b>Rebuild</b>, tối kỵ Deny.</li>
<li>Nguyên tắc <mark>4C</mark>: Candid, Compassionate, Corrective, Community.</li></ul>
<h3>Chuẩn bị</h3>
<p>Kế hoạch cho các kịch bản khả dĩ (five levels of contingency plans), phân trách nhiệm, xác định <mark>spokespersons</mark>, <mark>media training</mark> cho CEO; crisis team gồm press office, địa điểm an toàn để họp báo, danh bạ cơ quan bên ngoài.</p>`},
{n:12,t:"Leadership & Change Communication",h:`
<ul><li>Lãnh đạo <mark>có thể học và phát triển, có tính tình huống (situational)</mark>, không chỉ "born to lead". Phong cách phản ánh triết lý, tính cách, kinh nghiệm và hoàn cảnh tổ chức.</li>
<li>Lãnh đạo giỏi: <mark>hướng nhóm tới mục tiêu chung, truyền cảm hứng bằng vision</mark>, định hình cách người khác diễn giải, không bị cái tôi chi phối.</li></ul>
<h3>Loại thay đổi</h3>
<ul><li>Mức độ: radical/major vs minor/convergent. Thời gian: evolutionary vs revolutionary.</li>
<li><b>Additive:</b> <mark>cập nhật tổ chức cũ</mark> (cải tiến cách làm). <b>Substitutive:</b> <mark>rời bỏ tổ chức cũ</mark>, thay đổi chiến lược lớn, định nghĩa lại mission hoặc tái cấu trúc.</li></ul>
<h3>Kotter (8 bước)</h3>
<p>Create urgency → Guiding coalition → Vision & strategy → Communicate the vision → Empower broad-based action → Short-term wins → Consolidate gains, produce more change → Anchor in culture.</p>
<h3>Ma trận chọn chiến lược truyền thông thay đổi</h3>
<div class="tw"><table><tr><th></th><th>Low consensus building</th><th>High consensus building</th></tr>
<tr><td><b>High efficiency</b></td><td>Need to know</td><td>Quid pro quo</td></tr>
<tr><td><b>Low efficiency</b></td><td>Equal dissemination</td><td>Equal participation</td></tr></table></div>
<h3>5 chiến lược của Clampitt, DeKoch & Cashman (2000)</h3>
<ul><li><b>Spray and pray:</b> "xả" mọi thông tin, <mark>mong nhân viên tự lọc ra cái quan trọng</mark>.</li>
<li><b>Tell and sell:</b> chọn vài thông điệp cốt lõi, nói và "bán" cho nhân viên, <mark>ít đối thoại</mark>.</li>
<li><b>Underscore and explore:</b> nhấn mạnh vài vấn đề cốt lõi, đồng thời lắng nghe, khám phá hiểu lầm, rào cản. Thường được coi là <mark>hiệu quả nhất</mark>.</li>
<li><b>Identify and reply:</b> <mark>chủ yếu phản hồi lo ngại, tin đồn</mark> của nhân viên (reactive).</li>
<li><b>Withhold and uphold:</b> <mark>giữ thông tin đến khi buộc phải nói</mark>, rồi bảo vệ "party line".</li></ul>
<p>Garvin & Roberto (2005): <mark>change as a persuasion process</mark>. Lãnh đạo truyền thông hiệu quả cần <mark>authenticity</mark>, <mark>narratives and stories</mark>, <mark>conversational skills</mark>.</p>`},
{n:13,t:"CSR & Community Relations",h:`
<ul><li><b>CSR:</b> trách nhiệm giải trình với toàn xã hội, không chỉ cổ đông và khách hàng; nhà quản lý <mark>điều phối</mark> lợi ích xung đột của stakeholder thay vì kiểm soát họ (vd BP Gulf of Mexico).</li>
<li><b>WBCSD (2002):</b> cam kết liên tục của doanh nghiệp đóng góp phát triển kinh tế, đồng thời cải thiện chất lượng sống của người lao động, gia đình họ, cộng đồng và xã hội.</li>
<li><b>Corporate citizenship:</b> danh mục hoạt động để thực hiện bổn phận được nhận thức như một thành viên xã hội.</li>
<li><b>Triple bottom line</b> (John Elkington): People, Planet, Profit.</li>
<li>Codes: <b>OECD Guidelines</b> (nguyên tắc tự nguyện), <b>UN Global Compact</b> (10 nguyên tắc: human rights, labour, environment, anti-corruption).</li></ul>
<h3>Ba chiến lược truyền thông CSR (Morsing & Schultz)</h3>
<div class="tw"><table><tr><th>Strategy</th><th>Mô hình</th></tr>
<tr><td>Stakeholder information</td><td>One-way, công bố thông tin</td></tr>
<tr><td>Stakeholder response</td><td>Two-way asymmetric, khảo sát để điều chỉnh</td></tr>
<tr><td>Stakeholder involvement</td><td>Two-way symmetric, cùng xây dựng CSR</td></tr></table></div>
<ul><li><b>Greenwashing:</b> tuyên bố "xanh" vượt quá thực tế; liên quan <b>CSR hypocrisy</b>.</li>
<li>Reporting: 90% FTSE 100 có báo cáo CSR; hướng dẫn như GRI.</li></ul>
<h3>Community relations</h3>

function showQ(){
  if(S.shown)return;

function go(k){if(!S.shown||k<0||k>=S.ids.length)return;S.cur=k;save();paint();const q=$("#q");if(q)q.scrollTop=0}
function timer(){
  const el=$("#timer");if(!el)return;
  if(REV){el.textContent="Review";return}
  if(!S.shown){el.textContent=S.mins?hms(S.mins*60000):"—:—:—";return}
  if(!S.end){el.textContent="—:—:—";return}
  const left=S.end-Date.now();el.textContent=hms(left);
  if(left<=0){clearInterval(tick);submit()}
}

    $("#q").innerHTML=`<p class="ph">Nhập Open Code rồi bấm <b>Show Question</b> để hiện đề.</p>`;

document.addEventListener("keydown",e=>{

 được kiểm soát.", 9, 14, ""], ["SP24", "Which of the following is a characteristic of the rhetorical device Rhyme?", ["It refers to patterned and recurring alternations, at various intervals, of sound or speech elements.", "Another term for rhyme is beat.", "It is a weaker form of metaphor, using \"like\" or \"as\".", "The repetitive use of words with similar terminal sounds is a commonly used device to attract people's attention and help them remember things."], 3, "Rhyme: lặp các từ có âm cuối giống nhau để gây chú ý và dễ nhớ. A, B là rhythm; C là simile.", 10, 4, ""], ["SP24", "According to Deborah Cameron and Ivan Panović, what is discourse analysis?", ["is used in many fields: cultural studies, law, literature, philosophy, media studies, sociology, and social psychology.", "focuses attention not only on the content of written material but on the style that writers use, the language they use to express themselves, and the strategies they adopt to get their ideas across.", "focuses on the \"how\" not the \"what\".", "All of the above are correct."], 3, "Cameron & Panović: discourse analysis dùng ở nhiều ngành, chú ý cả phong cách, ngôn ngữ, chiến lược; hỏi \"how\" chứ không chỉ \"what\".", 11, 7, ""], ["SP24", "Fill in the blank: Temperature is a typical example of an ______ level of measurement.", ["Nominal", "Ordinal", "Interval", "Ratio"], 2, "Nhiệt độ là ví dụ điển hình của thang đo khoảng (interval): so được độ chênh nhưng không có điểm 0 tự nhiên.", 12, 15, ""], ["SP24", "Fill in the blank: In Jungian thought, the ______ represents the female element found in all males, and the ______ represents the male element found in all females. This duality is symbolized in hermaphrodites (people with sexual organs from both sexes) and in witches, priestesses, medicine men, and shamans.", ["Feminism, Masculinism", "Anima, Animus", "Girls, Boys", "Males, Females"], 1, "Jung: anima là yếu tố nữ trong nam, animus là yếu tố nam trong nữ.", 13, 6, ""], ["SP24", "The people who post messages on social media are, according to Marxist critics, unaware of the degree to which they are being exploited, since they have what Marx described as ______.", ["\"Unequal power relationship\"", "\"Capitalist societies\"", "\"Unpaid user labour\"", "\"False consciousness\""], 3, "Marx: false consciousness, người bị bóc lột không nhận ra mình bị bóc lột.", 14, 5, ""], ["SP24", "Among the Rhetorical Devices, which device means that it praises a thing (or a person) by dealing with its inherent qualities? An example is the advertising slogan \"tastes great, less filling\".", ["Definition", "Encomium", "Euphemism", "Exemplification"], 1, "Encomium: ca ngợi sự vật qua phẩm chất vốn có (\"tastes great, less filling\").", 15, 4, ""], ["SP24", "Which is the reason that researchers choose content analysis?", ["Get information about a topic and believe that content analysis, rather than other research methods, will help to get the information researchers are seeking", "Helps researchers obtain the answers to some questions such as how much violence there is on American television and whether there's more violence now than there was in earlier years", "Be interested in whether the amount of violence on American television differs from the amount of violence on British or French television (or some other country of interest to us) and use content analysis to find out", "All of others are correct"], 3, "Cả ba đều là lý do chọn content analysis: lấy thông tin về chủ đề, đo mức bạo lực theo thời gian, so sánh giữa các nước.", 16, 12, ""], ["SP24", "What is the first of a checklist on experimental design?", ["Who are the subjects (what population are they from) in your experiment?", "How were the subjects selected? Was it randomly done?", "Will the subjects be randomly assigned to groups?", "How many subjects will be in the experimental group and the control group?"], 0, "Mục đầu tiên của checklist thiết kế thực nghiệm: đối tượng (subjects) là ai, thuộc tổng thể nào.", 17, 14, ""], ["SP24", "A psychologist at a marketing company wishes to conduct interviews to understand teenagers'buying habits. In order to do a thematic analysis, she would have to", ["ask a colleague what they think of the data", "read and summarise the interviews", "find a set of themes", "create a coding scheme"], 2, "Thematic analysis là tìm ra tập chủ đề (themes) lặp lại trong dữ liệu phỏng vấn.", 18, 8, ""], ["SP24", "The statistics describing how broad the interval is on the measurement scale covered by the frequency distribution are usually called ______.", ["Measures of dispersion", "Measures of central tendency", "Levels of measurement"], 0, "Thống kê mô tả độ rộng của phân bố gọi là measures of dispersion (range, variance, standard deviation).", 19, 15, ""], ["SP24", "Which sentences is WRONG about \"postmodernism\"?", ["\"after\" modernism and \"different from\" modernism.", "connected to the rise of mass media", "Jean Baudrillard, a prominent French theorist of the subject, described as simulations and \"hyperreality\"", "Discover what'sintext"], 3, "\"Discover what's in text\" là việc của content analysis, không phải đặc điểm của postmodernism.", 20, 9, ""], ["SP24", "What research method that used to get information about certain groups of people representative of some larger group of interest is? For example, manufacturers of products want to know how people feel about their products (and those of their competitors) and use this to find out.", ["Experiment", "Participant observation", "Content analysis", "Survey"], 3, "Survey lấy thông tin từ mẫu đại diện cho nhóm lớn, ví dụ nhà sản xuất muốn biết khách nghĩ gì về sản phẩm.", 21, 13, ""], ["SP24", "Aristotle divided rhetoric into ______ areas.", ["Two", "Three", "Four", "Five"], 0, "Aristotle chia rhetoric thành hai mảng: public speaking và logical discussion.", 22, 4, ""], ["SP24", "Which of the following is NOT true regarding apply critical discourse analysis for advertising?", ["Advertising is an industry that has attracted the attention of scholars in many fields, including critical discourse analysis.", "Print advertisements often combine language and images and television commercials have dialogue, actors, sound effects and music, making them extremely complex texts for analysis", "Advertisements are interesting not only for what they say about the products being advertised but what they say about consumers.", "We can not apply critical discourse analysis for advertisements"], 3, "Câu sai là D: CDA hoàn toàn áp dụng được cho quảng cáo, và quảng cáo là đối tượng CDA rất quan tâm.", 23, 7, ""], ["SP24", "Probably the biggest problem with experiments is that they are artificial, conducted - generally speaking - in ______.", ["Laboratories", "Real life", "A situation", "None of the above"], 0, "Nhược điểm lớn nhất của thực nghiệm: tính nhân tạo, thường làm trong phòng thí nghiệm.", 24, 14, ""], ["SP24", "Observers affecting (by their presence) what goes on in a group is known as ______.", ["Influence", "Participatory", "Reactivity", "Problem (s)"], 2, "Reactivity: sự có mặt của người quan sát làm thay đổi hành vi của nhóm.", 25, 11, ""], ["SP24", "The error involves assuming that what is true of some X is true of all X. This fallacy is called ______.", ["False conclusions", "Oversimplification", "Overgeneralizing"], 2, "Overgeneralizing: cho rằng điều đúng với một số X thì đúng với mọi X.", 26, 16, ""], ["SP24", "Which might be described as applied/ adapted ethnomethodological research by sociologists (and other researchers, such as linguists and psychologists)?", ["Mass-mediated text", "Everyday life", "Routine interactions", "Ordinary people"], 0, "Dạng applied/adapted của ethnomethodology phân tích văn bản truyền thông đại chúng (phim, TV, bài hát); dạng thuần nghiên cứu đời sống thường ngày.", 27, 10, ""], ["SP24", "According to Wildavsky's cultural theory (1990), people (except for ______, that is) can move from one political culture to another if terature search vừa cho bối cảnh nghiên cứu, vừa cho người đọc thấy nguồn và độ tin cậy. Cả A và B.", 32, 2, ""], ["SP24", "Qualitative research can facilitate an evaluation, whereas quantitative research can generate a hypothesis or theory", ["True", "False"], 1, "Ngược lại mới đúng: định tính thường sinh giả thuyết/lý thuyết, định lượng dùng để kiểm định, đánh giá.", 33, 1, ""], ["SP24", "What were three kinds of signs according to Peirce's Trichotomy?", ["Icons, Indexes, and Images.", "Icons, Indexes, and Symbols", "Icons, Ideas, and Symbols.", "Figures; Indexes; and Symbols."], 1, "Peirce: icon (giống), index (quan hệ nhân quả), symbol (quy ước).", 34, 3, ""], ["SP24", "Which term means the entire constellation of a person's attitudes, beliefs, opinions, hopes, fears, prejudices, needs, desires, and aspirations that, taken together, govern how one behaves?", ["Value", "Attitude", "Life style", "Class"], 0, "Đây là định nghĩa \"values\" trong VALS (Arnold Mitchell): toàn bộ thái độ, niềm tin, nhu cầu, khát vọng chi phối hành vi.", 35, 13, ""], ["SP24", "In participant observation, researchers have to balance the role(s) that of ______.", ["Being participants", "Being observers", "Being interviewers", "Being judges"], 0, "Đáp án: AB. Người quan sát tham dự phải cân bằng hai vai: participant và observer. Câu chọn 2 đáp án.", 36, 11, ""], ["SP24", "In the book Childhood and Society (1963), psychoanalyst Erik Erikson developed his analysis of the crises we face as a series of oppositions we must confront and resolve. Which of the following is true regarding these crises?", ["Human beings all face certain developmental crises at different stages of their lives.", "Developmental crises, presented in the form of polar oppositions can be connected to our cell phone usage.", "The crisis that adolescents face is identity/role confusion (indicating that many adolescents send as many as 100 text messages a day to friends)", "All of the options are correct"], 3, "Erikson: ai
