analysis approach of critical discourse analysts from that of social linguists when examining advertising?", ["Social linguists focus solely on the structural patterns in texts like news stories, while critical discourse analysts consider the use of language for interpretation.", "Social linguists exclusively focus on the framing of stories in advertisements, whereas critical discourse analysts examine linguistic patterns in different genres.", "Social linguists emphasise how readers interpret texts, while critical discourse analysts concentrate on the style and language use in commercials.", "Social linguists primarily analyse the use of language in advertisements, while critical discourse analysts consider structural patterns in different genres."], 0, "Social linguists nhìn mẫu cấu trúc của văn bản (như tin tức); CDA xem ngôn ngữ được dùng thế nào để diễn giải, lộ ra ý thức hệ. ⚠ <i>Câu chưa chắc chắn, nên hỏi lại thầy cô.<\/i>", 46, 7, ""], ["SP24", "What is \"determine measurable scoring units\" in a content analysis?", ["This means figuring out your basic or standard unit of measurement.", "This is a process by which we classify data obtained from material studied and give each item in a category a symbol or number", "This means when making content analyses, examine only the manifest content of texts - that is, what is explicitly stated - rather than the latent content, the \"hidden\" material behind or between the words.", "This means before you begin, you have to decide what you are going to measure and what you hope to find out"], 0, "Determine measurable scoring units = xác định đơn vị đo cơ bản, chuẩn. B là coding, C là manifest content, D là xác định câu hỏi nghiên cứu.", 47, 12, ""], ["SP24", "Where are you doing your observation? What impact does the setting have on the behavior of the people being observed? Does the setting facilitate certain kinds of behavior and retard other kinds of behavior? In which consideration that these key questions are used for a participant observation?", ["The setting", "The participants", "The nature and purpose of the group", "The behavior of people in the group"], 0, "Các câu hỏi về nơi quan sát và ảnh hưởng của nơi đó thuộc mục \"The setting\".", 48, 11, ""], ["SP24", "Which is NOT TRUE about historical research?", ["Studies of the past, and in that respect, history is about the past.", "Rely on documents and other materials", "Always can interview people and get firsthand information that way.", "Historians interpret the past according to surviving evidence and conceptual frameworks"], 2, "Nghiên cứu lịch sử nói về quá khứ nên không phải lúc nào cũng phỏng vấn được người trong cuộc.", 49, 9, ""], ["SP24", "Which of the following statements accurately reflects the focus and key interests of ethnomethodologists as outlined in Harold Garfinkel's perspective?", ["Ethnomethodology primarily focuses on sociological theories and their application in everyday life", "Ethnomethodologists delve into the analysis of societal structures and hierarchies within communities.", "Ethnomethodology centers on people's common knowledge of society, their adequate grounds of inference, and their actions with in similar social contexts", "Ethnomethodologists specialize in investigating historical aspects and cultural traditions passed down through generations."], 2, "Garfinkel: ethnomethodology quan tâm tri thức thông thường về xã hội, căn cứ suy luận và hành động của con người trong bối cảnh tương tự.", 50, 10, ""], ["SU24", "Fill in the blank: Ethnography and observational methods, which have been used widely in media research to study both production and ______ of the media.", ["Collection", "Power", "Consumer", "Consumption"], 3, "Ethnography và quan sát dùng để nghiên cứu cả production lẫn consumption của truyền thông.", 1, 1, ""], ["SU24", "What are the two \"basic\" search strategies?", ["Going from the specific to the general and Going from the general to the specific.", "We have something rather specific in mind for our project, and we search for material of a rather general nature to give us a sense of context and to collect material that might be helpful to us.", "We have some area we are interested in studying and look around for information that will help us narrow our subject down to a manageable size - that is, information that will help us to focus.", "None are correct"], 0, "Hai chiến lược tìm tài liệu: đi từ cụ thể đến tổng quát và từ tổng quát đến cụ thể.", 2, 2, ""], ["SU24", "Fill in the blank: A relationship between signifiers and signifieds based on conventions has important implications, for it means that we need society and its institutions to teach us how to interpret ______.", ["signifiers", "signified", "symbols.", "images"], 0, "Quan hệ signifier–signified là quy ước, nên xã hội phải dạy ta cách diễn giải signifiers.", 3, 3, ""], ["SU24", "What were three kinds of signs according to Peirce's Trichotomy?", ["Icons; Indexes; and Images.", "Icons; Indexes; and Symbols", "Icons; Ideas; and Symbols.", "Figures; Indexes; and Symbols"], 1, "Peirce: icons, indexes, symbols.", 4, 3, ""], ["SU24", "Chapter 4: Rhetorical Analysis introduces three theories of communication. Which of the following is NOT a theory mentioned in the chapter?", ["Lasswell's model: Who? Says what? In which channel? To whom? With what effect?", "Temnos's model: Who? What? Where? When? Why?", "Berger's model: the artist, the work of art, the audience, the medium and America (or any society).", "Jakobson's model: Sender, Message, Contact, Receiver, Meaning"], 1, "Chương 4 nêu mô hình Lasswell, focal points của Berger và mô hình Jakobson; \"Who, what, where, when, why\" không phải mô hình trong chương.", 5, 4, ""], ["SU24", "A medical TVC used a doctor who has credibility to speak about medicine. Which mode of persuasion according to Aristotle's rhetoric, does this refer to?", ["Ethos: Personal character of speaker", "Pathos: Speaker stirring emotions in listeners", "Logos: Logical argument in speech", "Ego: Level of your ability and intelligence"], 0, "Ethos: thuyết phục bằng uy tín, tư cách của người nói (bác sĩ nói về thuốc).", 6, 4, ""], ["SU24", "Which of the following is NOT a Common Rhetorical Device?", ["Comparison", "Contrast", "Metonymy", "Euphemism"], 1, "Miniglossary có Comparison, Metonymy, Euphemism; không có \"Contrast\" (chỉ có Antithesis).", 7, 4, ""], ["SU24", "Which of the following is NOT true regarding visual images?", ["We can extend rhetorical methods of analyzing written texts to visual images", "Defining a visual image is easy.", "Images have a denotational and connotational significance.", "Images often generate emotional responses."], 1, "Định nghĩa hình ảnh thị giác không hề dễ; các ý còn lại đều đúng.", 8, 4, ""], ["SU24", "According to Marxist thought, people embrace the notion of the \"self-made man and woman\". Which of the following does NOT belong to this notion?", ["We downgrade the importance of social, economic, and political matters.", "We place too much importance on individual psychology and personality, the will to succeed, personal resolution, and the ability to \"market\" oneself.", "We are \"prisoners of psychology\" in that we don't see society as important; only we, our willpower, and our personality are important.", "All of the above are parts of the notion \"self-made man and woman\"."], 3, "A, B, C đều là nội dung của quan niệm \"self-made man and woman\" nên chọn D.", 9, 5, ""], ["SU24", "In his book \"Ways of Seeing\" (1972), British Marxist writer John Berger wrote that: Advertising uses the power of ______ that we have of ourselves and those others have of us after we've been transformed by purchasing this or that product. Which of the following terms may be used in the gap?", ["Envy (the feeling that you wish you had something that someone else has)", "Fear (an unpleasant emotion or thought that you have when you are frightened or worried by something dangerous, painful, or bad that is happening or might happen)", "Persuasion (a particular set of beliefs, especially religious or political ones)", "None of the above are correct."], 0, "John Berger: quảng cáo vận hành dựa trên envy, sự ghen tị với chính mình sau khi được sản phẩm \"biến đổi\".", 10, 5, ""], ["SU24", "Among the below theories, which theory applies the insights of Sigmund Freud and other thinkers, such as Carl Jung, to texts of all kinds-works of serious literature as well as mass-mediated texts?", ["Psychoanalytic theory", "Ideological criticism", "Intercultural theory", "Discourse analysis"], 0, "Psychoanalytic theory vận dụng Freud, Jung để phân tích mọi loại văn bản. <span class=\"hint\">[trùng câu 38 đề SP24]<\/span>", 11, 6, "dup"], ["SU24", "Tom and Sally have been dating for two years. Sally breaks up with Tom because he cheated on her with Betty. Betty, who did not know about Sally, tells Tom that she is glad that he feels guilty for hurting Sally. She also tells him that it will take a long time to get over the guilt. In the above example, Betty is using ______ as a defense mechanism.", ["projection", "denial", "repression", "regression"], 0, "Projection: gán cảm giác tội lỗi của mình cho người khác.", 12, 6, ""], ["SU24", "From Erikson's perspective, the countless text messages young people send one another have a deeper and more significant meaning than we might imagine, for they are attempts at, among other things, ______.", ["Ego integrity", "Despair", "Self-definition", "Generativity"], 2, "Erikson: tin nhắn dồn dập của giới trẻ là nỗ lực tự xác định bản thân (self-definition).", 13, 6, ""], ["SU24", "Most heroes, especially those found in today's mass media, generally don't succumb to the sin of pride. It According to Henderson, the myth of the hero has an important role because: ______", ["It helps people understand their ego consciousness.", "It helps people develop their ego consciousness.", "It helps people develop their anima/animus.", "It helps people understand their anima/animus."], 1, "Henderson: huyền thoại người hùng giúp con người phát triển ego consciousness.", 14, 6, ""], ["SU24", "Fill in the blank: According to the textbook, discourse analysis covers a lot of territory, though it tends to focus on ______ (talk, conversation) and ______ of all kinds (including texts with visual components and computer-mediated texts).", ["texts, visuals", "voice, writing", "oral discourse, written discourse", "audio, texts"], 2, "Discourse analysis tập trung vào oral discourse (talk, conversation) và written discourse mọi loại.", 15, 7, ""], ["SU24", "What is the definition of discourse analysis in media and communication research?", ["The investigation of the media's impact on interpersonal communication patterns", "The study of the media's role in shaping public opinion and political discourse.", "The analysis of language use and social practices in various forms of communication.", "The examination of media's representation of cultural identities and diversity."], 2, "Discourse analysis: phân tích việc sử dụng ngôn ngữ và thực hành xã hội trong các hình thức giao tiếp. <span class=\"hint\">[trùng câu 39 đề SP24]<\/span>", 16, 7, "dup"], ["SU24", "From a semiotic perspective, in fashion advertisements:", ["Clothes and other objects are signs, conveying information.", "Fashion is form of messaging: dress style, identity, shaped by cultural codes", "We cannot apply semiotic analysis for researching fashion advertisements.", "A and B are correct"], 3, "Theo ký hiệu học, quần áo là sign truyền thông tin và thời trang là một dạng thông điệp; A và B đúng.", 17, 3, ""], ["SU24", "Which of the following is true regarding applying Discourse Analysis for researching fashion advertisements?", ["Fashion is of interest to social/ qualitative research", "Fashion suits discourse analysis because the language used/images in fashion advertising/media coverage are topics.", "Fashion suits discourse analysis because Fashion advertisements can reveal about political ideologies and social distinctions.", "All of the options are correct"], 3, "Cả ba đều đúng nên chọn D.", 18, 7, ""], ["SU24", "Which of the following is LEAST likely to be a component of multimodal critical discourse analysis?", ["Semiotics", "Ideological analysis", "Rhetorical theory", "Questionnaires"], 3, "Bảng hỏi không phải thành phần của multimodal CDA.", 19, 7, ""], ["SU24", "How do you understand about \"Unstructured Interviews\"?", ["In these interviews, the researcher is focused and is trying to gain information, but he or she exercises relatively little control over the responses of the informant.", "In these interviews, the interviewer usually has a written list of questions to ask the informant but tries to extent if possible.", "There are few controls in these interviews; they just take place, are not organized or focused, and are generally used to introduce researchers to their informants.", "In these interviews, the interviewer has a specific set of instructions that guide those who ask respondents questions."], 0, "Unstructured interview: nhà nghiên cứu có trọng tâm, muốn lấy thông tin nhưng ít kiểm soát câu trả lời.", 20, 8, ""], ["SU24", "According to our textbook, the simplest way to describe an interview is as a conversation between ______ (someone who wishes to gain information about a subject) and ______ (someone who presumably has information of interest on the subject).", ["a researcher, an informant", "an interviewer, an interviewee", "a researcher, a subject", "an interviewer, a respondent"], 0, "Phỏng vấn = cuộc trò chuyện giữa researcher (cần thông tin) và informant (có thông tin).", 21, 8, ""], ["SU24", "When conducting a research interview, which is a reason for looking at how the informant categorizes things (such as \"old\" and \"young\", \"good\" and \"bad\" defined)?", ["To get a sense of how informants' minds work and how they make sense of the world", "To challenge the language use of the informants", "To make the interview process longer.", "To make sure that you use the informants effectively."], 0, "Xem cách informant phân loại sự vật để hiểu cách họ nghĩ và hiểu thế giới.", 22, 8, ""], ["SU24", "What challenges do researchers often face while dealing with informants or respondents during interviews?", ["Informants generally share accurate and unbiased information about their experiences.", "Informants' memory lapses result in fabrication or the unintentional creation of facts.", "People always have useful and substantial information to share during interviews.", "Informants never tailor their responses to satisfy the interviewer's expectations"], 1, "Người trả lời có thể nhớ sai, vô tình \"tạo\" ra sự kiện; các ý còn lại ngược với thực tế.", 23, 8, ""], ["SU24", "Which is NOT characteristics of specialized discipline?", ["Trained in a subject area", "Can deal with all areas", "May lack technique", "Deals only with own subject"], 1, "Chuyên ngành hẹp thì chỉ xử lý lĩnh vực của mình; \"xử lý được mọi lĩnh vực\" là đặc điểm của người làm tổng quát (metadiscipline).", 24, 9, ""], ["SU24", "Which is PRIMARY SOURCE in writing history?", ["Newspaper articles", "Articles by other historians", "Articles and books by scholars", "Ideas from philosophers"], 0, "Bài báo đương thời là nguồn sơ cấp; bài của sử gia, học giả, triết gia là nguồn thứ cấp.", 25, 9, ""], ["SU24", "How did Harold Garfinkel conceptualize the term \"ethnomethodology\"?", ["It referred to the availability of sophisticated knowledge within a society, such as knowledge of botanical matters.", "It emphasized the study of societal norms and customs in various cultures, such as anthropology.", "It focused on the development of scientific methods within cultural settings, such as ethnography.", "It highlighted the exclusive use of commonsense knowledge by members of a society in their daily conduct."], 3, "Garfinkel: \"ethno\" chỉ tri thức thông thường (commonsense knowledge) mà thành viên xã hội dùng trong sinh hoạt hằng ngày.", 26, 10, ""], ["SU24", "Which below is characteristic of applied form of ethnomethodological research?", ["Uses films, television programs, songs, and other mediated texts", "Everyday life routines", "Not only everyday life routines but also films and other mediated texts", "None of other is correct"], 0, "Dạng applied dùng phim, chương trình TV, bài hát và các văn bản truyền thông; dạng thuần mới là sinh hoạt thường ngày. Bản quiz ghi C, em theo cách phân loại pure/applied của giáo trình. ⚠ <i>Câu chưa chắc chắn, nên hỏi lại thầy cô.<\/i>", 27, 10, ""], ["SU24", "What does NOT the metaphor \"Love is a game\" imply about love?", ["Someone wins and someone loses", "Sometimes you are winning, and other times you might be losing", "Love is not serious", "No rules to follow in games."], 3, "\"Love is a game\" hàm ý có thắng thua, có lúc thắng lúc thua, không nghiêm túc, và có luật chơi. \"Không có luật\" là sai. <span class=\"hint\">[trùng câu 43 đề SP24]<\/span>", 28, 10, "dup"], ["SU24", "Ethnomethodology can be used to study intercultural communication, exploring the national codes employed by members of each culture. This approach helps determine the reasons behind communication problems that arise when people from different cultures and countries attempt to interact", ["True", "False"], 0, "Đúng: ethnomethodology dùng được cho giao tiếp liên văn hóa, tìm các \"code\" quốc gia gây trục trặc khi giao tiếp.", 29, 10, ""], ["SU24", "What does participant observation differ from everyday observation?", ["Always observing people and events and trying to make sense of things", "Interview people and get firsthand information that way", "Research on everyday routines", "Focusing on what the observer wants to find out (objective and systematic), not trying to make sense of things."], 3, "Participant observation tập trung vào điều cần tìm, khách quan và có hệ thống; quan sát thường ngày thì chỉ cố hiểu sự việc.", 30, 11, ""], ["SU24", "Fill in the blank: Observational research is a superior technique to survey research, experimentation and focus groups for collecting ______ on ______.", ["data – non-verbal behavior", "data – language", "facts – behavior", "facts – attitude"], 0, "Quan sát vượt trội khi thu data về hành vi phi ngôn ngữ (non-verbal behavior).", 31, 11, ""], ["SU24", "Which below is the problem of mind reading in a participant observation?", ["Maintaining your objectivity in choosing where to focus your attention, what to record in your notes, and what to omit.", "The issue of reactivity, for example: Does your presence change the way people normally relate to one another?", "Observers going beyond recording what people do and assuming they can read people's minds and figure out why people are doing something.", "Consider how representative the activities you observed were and whether the reactivity effect might have shaped the behavior of the group in certain ways."], 2, "Mind reading: vượt quá việc ghi lại hành vi, tự cho là đọc được suy nghĩ và lý do của người ta.", 32, 11, ""], ["SU24", "Which research method can deal with actual behavior - such as people talking with one another; characters acting certain ways in comic strips, video games, films, and television programs; or writers describing \"heroes\" in magazine biographies?", ["Content analysis", "Historical research", "Interview", "Participant observation"], 0, "Content analysis xử lý được hành vi thực tế được ghi lại trong văn bản: lời thoại, hành động nhân vật, cách mô tả.", 33, 12, ""], ["SU24", "In content analysis, which definition means that we seek units for analysis and categorize them using clearly defined criteria?", ["Objective", "Systematic", "Manifest", "Quantitative"], 0, "Objective: phân loại đơn vị phân tích theo tiêu chí định nghĩa rõ ràng. Systematic là đếm mọi khía cạnh liên quan của mẫu.", 34, 12, ""], ["SU24", "What is \"determine measurable scoring units\" in a content analysis?", ["This means figuring out your basic or standard unit of measurement.", "This is a process by which we classify data obtained from material studied and give each item in a category a symbol or number", "This means when making content analyses, examine only the manifest content of texts-that is, what is explicitly stated-rather than the latent content, the \"hidden\" material behind or between the words", "This means before you begin, you have to decide what you are going to measure and what you hope to find out"], 0, "Determine measurable scoring units = xác định đơn vị đo cơ bản, chuẩn. B là coding, C là manifest content, D là xác định câu hỏi nghiên cứu. <span class=\"hint\">[trùng câu 47 đề SP24]<\/span>", 35, 12, "dup"], ["SU24", "Which is difficulty in making content analyses?", ["Finding a representative sample", "Determining measurable units", "Obtaining reliability in coding", "All of others are correct"], 3, "Khó khăn: tìm mẫu đại diện, xác định đơn vị đo, đạt độ tin cậy khi mã hóa. Cả ba.", 36, 12, ""], ["SU24", "What research method that used to get information about certain groups of people representative of some larger group of interest is? For example, manufacturers of products want to know how people feel about their products (and those of their competitors) and use this to find out.", ["Experiment", "Participant observation", "Content analysis", "Survey"], 3, "Survey lấy thông tin từ nhóm người đại diện cho nhóm lớn hơn.", 37, 13, ""], ["SU24", "Which is an advantage of survey interviews?", ["You know who is answering questions", "Inexpensive", "Time-consuming and expensive", "Hard to find people in sample at times"], 0, "Ưu điểm phỏng vấn khảo sát: biết chắc ai đang trả lời. C, D là nhược điểm.", 38, 13, ""], ["SU24", "Which type of survey question is more likely to yield quantitative data in communication research?", ["Closed-ended", "Open-ended", "Both equally", "None of them"], 0, "Câu hỏi đóng cho dữ liệu định lượng.", 39, 13, ""], ["SU24", "Fill in the blank: ______ is the type of design is also known as between groups. Different participants are used in each condition of the independent variable.", ["Independent Measures", "Repeated Measures", "Matched Pairs", "Dependent Measures"], 0, "Independent measures (between groups): mỗi điều kiện dùng một nhóm người khác nhau.", 40, 14, ""], ["SU24", "Probably the biggest problem with experiments is that they are artificial, conducted - generally speaking - in ______.", ["Laboratories", "Real life", "A situation", "None of the above"], 0, "Thực nghiệm thường làm trong phòng thí nghiệm nên nhân tạo.", 41, 14, ""], ["SU24", "Fill in the blank: The ______ group, in a sense, was the population not involved in the experiment.", ["Control", "Stimulus", "Treatment", "Intervention"], 0, "Control group: nhóm không chịu tác động thực nghiệm, dùng để so sánh.", 42, 14, ""], ["SU24", "Fill in the blank: In ______ the investigator himself creates the setting for his observations.", ["Laboratory experiments", "Field experiments", "Natural experiments", "Artificial environment experiments"], 0, "Laboratory experiment: nhà nghiên cứu tự tạo bối cảnh quan sát.", 43, 14, ""], ["SU24", "If the minimum value is 2 and the maximum value is 12, so the range is equal to ______.", ["9", "8", "10", "12"], 2, "Range = max − min = 12 − 2 = 10.", 44, 15, ""], ["SU24", "The statistics describing how broad the interval is on the measurement scale covered by the frequency distribution are usually called ______.", ["Measures of dispersion", "Measures of central tendency", "Levels of measurement"], 0, "Measures of dispersion.", 45, 15, ""], ["SU24", "We don't focus our attention on the argument being made but on the person who has made it. Which is the common fallacy in research?", ["Oversimplification", "Ad hominem arguments", "Falsify results", "Dishonest"], 1, "Ad hominem: công kích người nói thay vì lập luận.", 46, 16, ""], ["SU24", "In research reports, in which section you deal with the operationalization (the activities carried out) in your research?", ["Introduction", "Method", "Results", "Discussion"], 1, "Phần Method trình bày operationalization, các hoạt động đã thực hiện.", 47, 17, ""], ["SU24", "Fill in the blank: To writing correctly, avoiding some common problems in research reports, ______ passages are ungainly and stiff and not well formed.", ["Awkward", "Coherence", "Dashes and hyphens", "Comma faults"], 0, "Awkward passages: đoạn văn vụng, cứng, không trau chuốt.", 48, 17, ""], ["SU24", "What ethical issues should you keep in mind when conducting observational research?", ["You should not use people as a means toward other ends, even if you think those ends are positive", "You should not do anything that will have negative effects on those you study.", "You must be honest in designing your research and reporting your findings about those you study.", "All of them are correct."], 3, "Cả ba đều là nguyên tắc đạo đức khi quan sát.", 49, 11, ""], ["SU24", "Which definition describes a specific set of questions that respondents answer?", ["Questionnaire", "Participant observation", "Historical analysis", "Content analysis"], 0, "Questionnaire: bộ câu hỏi cụ thể để người trả lời điền.", 50, 13, ""], ["FA24", "Fill in the blank: Research is not principally about gathering ______ that lends itself to easy collection or analysis, but rather about using/choosing the right methodological tools for addressing 'relevant' questions.", ["Analysis", "Questions", "Data", "Collection"], 2, "Nghiên cứu không phải là gom data dễ lấy, dễ phân tích, mà là chọn đúng công cụ cho câu hỏi \"relevant\".", 1, 1, ""], ["FA24", "What are the two \"basic\" search strategies?", ["Going from the specific to the general and Going from the general to the specific.", "We have something rather specific in mind for our project, and we search for material of a rather general nature to give us a sense of context and to collect material that might be helpful to us.", "We have some area we are interested in studying and look around for information that will help us narrow our subject down to a manageable size - that is, information that will help us to focus.", "None are correct"], 0, "Hai chiến lược tìm tài liệu: đi từ cụ thể đến tổng quát và từ tổng quát đến cụ thể. <span class=\"hint\">[trùng câu 2 đề SU24]<\/span>", 2, 2, "dup"], ["FA24", "Think about how the color red is used on traffic lights to warn drivers of certain dangers, indicating that they should be prepared to stop. In this case, the color red serves as an example of a signifier, and the warning itself is an example of what is signified.", ["True", "False"], 0, "Đúng: màu đỏ là signifier, lời cảnh báo là signified.", 3, 3, ""], ["FA24", "What is semiotics?", ["the science of signs.", "the science of signature.", "a particular cultural concept", "sign processes"], 0, "Semiotics là khoa học về ký hiệu (the science of signs).", 4, 3, ""], ["FA24", "The linguist Roman Jakobson offered the well-known model for the communication process with the five focal points, which are:", ["Who? Says what? In which channel? To whom? With what effect?", "Who? What? Where? When? Why?", "the artist, the work of art, the audience, the medium and America (or any society)", "Sender, Message, Contact, Receiver, Meaning"], 3, "Jakobson: Sender, Message, Receiver, Contact (medium), Code, Context. A là Lasswell, C là focal points của Berger.", 5, 4, ""], ["FA24", "Among the Rhetorical Devices, which device means the use of several words in a passage that starts with the same letter or that repeat some vowel?", ["Allegory", "Alliteration", "Allusions", "Ambiguity"], 1, "Alliteration: lặp phụ âm đầu hoặc nguyên âm ở nhiều từ liền nhau.", 6, 4, ""], ["FA24", "Which of the following is NOT a common rhetorical device?", ["Comparison", "Contrast", "Metonymy", "Euphemism"], 1, "Miniglossary có Comparison, Metonymy, Euphemism; không có \"Contrast\" (chỉ có Antithesis). <span class=\"hint\">[trùng câu 7 đề SU24]<\/span>", 7, 4, "dup"], ["FA24", "T ck.", 12, 6, ""], ["FA24", "How does Erik Erikson's concept of identity/role confusion relate to the usage of smartphones among adolescents?", ["Adolescents primarily use smartphones for family integration and play, facilitating the resolution of identity crises.", "Smartphone usage during adolescence often involves peer group bonding and romantic interactions, aiding in the exploration of self-identity.", "Adolescents avoid smartphone usage during the identity/role confusion stage to prevent distraction from resolving their crises.", "Smartphone usage among adolescents during this stage primarily focuses on career development and community engagement."], 1, "Giai đoạn identity/role confusion: thanh thiếu niên dùng điện thoại để gắn kết bạn bè, yêu đương, khám phá bản sắc.", 13, 6, ""], ["FA24", "According to Henderson, the myth of the hero has an important role because:", ["It helps people understand their ego consciousness.", "It helps people develop their ego consciousness.", "It helps people develop their anima/animus.", "It helps people understand their anima/animus."], 1, "Henderson: huyền thoại người hùng giúp phát triển ego consciousness.", 14, 6, ""], ["FA24", "According to Teun A. van Dijk, discourse analysis has three main dimensions. Which of the following is true regarding these three dimensions?", ["three main dimensions are (a) language use, (b) the communication of beliefs (cognition), and (c) interaction", "discourse studies provide integrated descriptions of these three dimensions", "Both A and B are correct", "None of the above are correct"], 2, "Van Dijk: ba chiều là language use, communication of beliefs (cognition), interaction; discourse studies mô tả tích hợp cả ba. Cả A và B.", 15, 7, ""], ["FA24", "Teun A. van Dijk (1997) provides insight into the essence of discourse analysis and delves into its three primary dimensions, which include:", ["Language use", "The communication of beliefs (cognition)", "Interaction in social situations.", "All ence) what goes on in a group is known as", ["Influence", "Participatory", "Reactivity", "Problem (s)"], 2, "Reactivity: sự có mặt của người quan sát làm thay đổi hành vi của nhóm. <span class=\"hint\">[trùng câu 25 đề SP24]<\/span>", 31, 11, "dup"], ["FA24", "Fill in the blank: Frequently, researchers doing content analysis state the problem they want to investigate in the form of a/an ______ to give their research more focus. For example, we may offer a/an ______ that with the rise of feminism, the way women are portrayed in fashion ads has changed and there is less \"sexploitation\" of women's bodies now than in earlier years.", ["hypothesis – hypothesis", "information – information", "topic – topic", "definition – definition"], 0, "Người làm content analysis thường phát biểu vấn đề dưới dạng giả thuyết (hypothesis).", 32, 12, ""], ["FA24", "In content analysis, which definition means that we count what is tangible and observable?", ["Manifest", "Quantitative", "Objective", "Systematic"], 0, "Manifest: chỉ đếm cái hữu hình, quan sát được, không suy diễn nội dung ẩn.", 33, 12, ""], ["FA24", "\"In 1995, there were approximately 10 acts of violence per hour on television, and in 2015, there were approximately 30 acts of violence per hour on television. This indicates that in 2015, there was three times as much violence per hour on American television as there was 30 years earlier.\" What type of methodological approach to content analysis does this example describe?", ["Use a historical approach when making a content analysis", "Use a comparative approach when making a content analysis", "Determine measurable scoring units", "Determine your research question"], 0, "So sánh 1995 với 2015 là dùng cách tiếp cận lịch sử (theo thời gian).", 34, 12, ""], ["FA24", "What is difficult about making content analysis?", ["Obtaining reliability in coding", "Defining terms operationally", "Ensuring validity and utility in your findings", "All of the above are correct."], 3, "Khó
